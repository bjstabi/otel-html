name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Every night, and on demand, the whole suite runs for real: a replay cannot catch a flaky test, a marginal @perf
  # budget, a date-dependent test or runner image drift.
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      task_cache:
        description: Replay unchanged tasks from the mise task cache
        type: boolean
        default: false

concurrency:
  # By event too: a nightly run on main must not cancel a push's run, or be cancelled by one.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    # Every job's steps run under the built CLI; the few steps that run before dist/ exists say `shell: bash`.
    shell: node dist/cli/main.js run -o .otel-html/report -- bash --noprofile --norc -eo pipefail {0}

permissions:
  contents: read
  actions: read

env:
  # `claude` and `watchexec` (`mise watch`) are developer tools; CI never needs them.
  MISE_DISABLE_TOOLS: claude,watchexec
  # `read-write` is mise's default; an empty value is an error.
  MISE_TASK_CACHE: off

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The @perf budgets scale by (calibration ÷ this), never below 1: GitHub's runners come as AMD EPYC 9V45
      # (~85 ms, budgets as written) and EPYC 7763 (~150 ms, about 1.5×). See test-support/calibrate.ts.
      OTEL_HTML_PERF_REFERENCE_MS: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # mise's task state: the freshness records (state dir) and the cached results (task.cache_dir in mise.toml). Every run saves under a unique key and restores the latest of its own job, so an unchanged task replays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
          key: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
      - run: mise run gen:check
      - run: mise run check
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-${{ github.job }}

  unit-os:
    strategy:
      fail-fast: true
      # No macOS runners (cost); Linux runs the unit tests in `check`.
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The @perf budgets scale by (calibration ÷ this), never below 1: GitHub's runners come as AMD EPYC 9V45
      # (~85 ms, budgets as written) and EPYC 7763 (~150 ms, about 1.5×). See test-support/calibrate.ts.
      OTEL_HTML_PERF_REFERENCE_MS: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # As the other jobs; the third path is mise's Windows state dir, UNVERIFIED (no Windows run yet): a missing directory only makes actions/cache warn.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
            ~/AppData/Local/mise/state
          key: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
      - run: mise run test:unit
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-${{ github.job }}${{ matrix.os && format('-{0}', matrix.os) || '' }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
      # `check:package` (publint + attw) depends on `build`; --skip-deps keeps it from cleaning dist/ under the running job shell.
      - run: mise run --skip-deps check:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-${{ github.job }}

  e2e:
    strategy:
      # Each browser reports on its own; one failing browser must not hide the others' results.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        include:
          # Playwright's Linux WebKit runs JavaScript ~16x slower than WebKit on macOS (Chromium here is ~2x), so
          # its @perf budgets are scaled; the budget constants stay fixed and are met on macOS.
          - project: webkit
            perf_factor: 6
    runs-on: ubuntu-latest
    # The official image ships all three browsers and their OS libraries, matching @playwright/test (keep this tag
    # in step with package.json). `playwright install --with-deps webkit` spent ~9 of 10 minutes in apt fetching
    # ~190 packages. Non-root (the runner's uid) because Firefox refuses to run as root; HOME is /github/home.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    env:
      OTEL_HTML_PERF_FACTOR: ${{ matrix.perf_factor || 1 }}
      # The @perf budgets scale by (calibration ÷ this), never below 1: GitHub's runners come as AMD EPYC 9V45
      # (~85 ms, budgets as written) and EPYC 7763 (~150 ms, about 1.5×). See test-support/calibrate.ts.
      OTEL_HTML_PERF_REFERENCE_MS: "100"
      # The image already has the browsers; test:e2e would otherwise run `playwright install` for all three.
      OTEL_HTML_SKIP_BROWSER_INSTALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # mise's task state: the freshness records (state dir) and the cached results (task.cache_dir in mise.toml). Every run saves under a unique key and restores the latest of its own job, so an unchanged task replays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
          key: mise-tasks-${{ runner.os }}-${{ github.job }}${{ matrix.project && format('-{0}', matrix.project) || '' }}-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}${{ matrix.project && format('-{0}', matrix.project) || '' }}-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
      # The job shell wraps these in `otel-html run`; the exit code is Playwright's.
      # --skip-deps: dist/ was built by the Build step above and must not be cleaned under the running job shell,
      # so the fixture reports are built here, once, and test:e2e's own e2e:fixtures dependency is skipped.
      - run: mise run --skip-deps e2e:fixtures
      # `--browser` selects the `<browser>-file` and `<browser>-http` projects, then the `<browser>-perf-file` pass.
      - run: mise run --skip-deps test:e2e --browser ${{ matrix.project }}
      # The reporter is `list`, so failure traces and screenshots land in test-results/.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-report-${{ matrix.project }}
          path: e2e/.reports/sample
          include-hidden-files: true
          if-no-files-found: ignore
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-${{ github.job }}${{ matrix.project && format('-{0}', matrix.project) || '' }}

  # The metrics scale check (spec §7: Explorer < 2 s, Catalog < 1 s on 200 metrics × 1,000 series × 1 h at 10 s),
  # Chromium only, in the Playwright image like the jobs above. Its report writes the full 1 h only for the metric the
  # Explorer charts and the first and last collection for the rest (~0.76M points, ~150 MB; a few seconds locally, under a minute on CI); the
  # test fails if either page loads another metric's files (e2e/fixture.ts, e2e/scale.spec.ts). The matrix jobs leave
  # it off and this job alone sets OTEL_HTML_METRICS_SCALE.
  e2e-metrics-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    env:
      OTEL_HTML_METRICS_SCALE: "1"
      # The @perf budgets scale by (calibration ÷ this), never below 1: GitHub's runners come as AMD EPYC 9V45
      # (~85 ms, budgets as written) and EPYC 7763 (~150 ms, about 1.5×). See test-support/calibrate.ts.
      OTEL_HTML_PERF_REFERENCE_MS: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # mise's task state: the freshness records (state dir) and the cached results (task.cache_dir in mise.toml). Every run saves under a unique key and restores the latest of its own job, so an unchanged task replays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
          key: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
      # The metrics-scale tests are @perf, so they live in the chromium-perf-file project. Global setup asserts the
      # other fixture reports exist, and the spec writes the metrics-scale report itself.
      - run: mise run --skip-deps e2e:fixtures
      - run: pnpm exec playwright test e2e/scale.spec.ts --project chromium-perf-file --grep 'metrics scale' --workers=1
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-metrics-scale
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-${{ github.job }}

  # Unit coverage of the suite without @perf, on main only (never gates anything). `mise run coverage` has no sources and no
  # cache, so nothing can replay it and leave coverage/ empty.
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
      - run: mise run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-${{ github.job }}

  # The standalone Bun binaries, built and smoke-tested on every PR (convert, serve over HTTP and gRPC, run, SIGINT, bad
  # port). The release workflow keeps its own smoke step, which tests the artefact it uploads.
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
      - run: mise run build:binaries -- --target "$TARGET"
      - run: OTEL_HTML_BINARY="dist/bin/otel-html-$TARGET" pnpm exec vitest run test/cli/binary.test.ts
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-${{ github.job }}${{ matrix.target && format('-{0}', matrix.target) || '' }}${{ matrix.os && format('-{0}', matrix.os) || '' }}
