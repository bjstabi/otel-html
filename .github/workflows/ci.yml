name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `claude` in mise.toml is a developer tool; CI never needs it.
  MISE_DISABLE_TOOLS: claude

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: mise run gen:check
      - run: mise run check

  unit-os:
    needs: check
    strategy:
      fail-fast: true
      # No macOS runners (cost); Linux runs the unit tests in `check`.
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: mise run test:unit

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # `check:package` (publint + attw) depends on `build`, so this one task builds and then checks the package.
      - run: mise run check:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  e2e:
    needs: build
    strategy:
      # Each browser reports on its own; one failing browser must not hide the others' results.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        include:
          # Playwright's Linux WebKit runs JavaScript ~16x slower than WebKit on macOS (Chromium here is ~2x), so
          # its @perf budgets are scaled; the budget constants stay fixed and are met on macOS.
          - project: webkit
            perf_factor: 6
    runs-on: ubuntu-latest
    # The official image ships all three browsers and their OS libraries, matching @playwright/test (keep this tag
    # in step with package.json). `playwright install --with-deps webkit` spent ~9 of 10 minutes in apt fetching
    # ~190 packages. Non-root (the runner's uid) because Firefox refuses to run as root; HOME is /github/home.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    env:
      OTEL_HTML_PERF_FACTOR: ${{ matrix.perf_factor || 1 }}
      # The image already has the browsers; test:e2e would otherwise run `playwright install` for all three.
      OTEL_HTML_SKIP_BROWSER_INSTALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # --skip-deps: use the dist/ built and package-checked by the build job instead of rebuilding.
      # Playwright projects are named `<browser>-file` and `<browser>-http`.
      - run: mise run --skip-deps test:e2e -- --project '${{ matrix.project }}-*'
      # The reporter is `list`, so failure traces and screenshots land in test-results/.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-report-${{ matrix.project }}
          path: e2e/.reports/sample
          include-hidden-files: true
          if-no-files-found: ignore

  # The metrics scale check (spec §7: Explorer < 2 s, Catalog < 1 s on 200 metrics × 1,000 series × 1 h at 10 s),
  # Chromium only. Writing its report takes ~15 minutes and ~12 GB of disk (another ~2 GB go to the other e2e
  # reports), so the matrix jobs above leave it off and this job alone sets OTEL_HTML_METRICS_SCALE. GitHub
  # guarantees 14 GB of SSD on a standard ubuntu-latest runner, and `df` there usually shows ~20 GB or more free
  # on /, which also holds the container's workspace: the `df` steps log the margin.
  e2e-metrics-scale:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    env:
      OTEL_HTML_METRICS_SCALE: "1"
      OTEL_HTML_SKIP_BROWSER_INSTALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - run: df -h .
      - run: pnpm exec playwright test e2e/scale.spec.ts --project 'chromium-*' --grep 'metrics scale' --workers=1
      - if: always()
        run: df -h .
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-metrics-scale
          path: test-results/
          if-no-files-found: ignore
