name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Every night, and on demand, the whole suite runs for real: a replay cannot catch a flaky test, a marginal @perf
  # budget, a date-dependent test or runner image drift.
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      task_cache:
        description: Replay unchanged tasks from the mise task cache
        type: boolean
        default: false

concurrency:
  # By event too: a nightly run on main must not cancel a push's run, or be cancelled by one.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    # Every job's steps run under the built CLI; the few steps that run before dist/ exists say `shell: bash`.
    shell: node dist/cli/main.js run -o .otel-html/report -- bash --noprofile --norc -eo pipefail {0}

permissions:
  contents: read
  actions: read

env:
  # `claude` and `watchexec` (`mise watch`) are developer tools; CI never needs them.
  MISE_DISABLE_TOOLS: claude,watchexec
  # Under the job shell every `mise run` task exports its span to `otel-html run`'s receiver (the endpoint and
  # TRACEPARENT come from `run`); outside it there is no endpoint and mise exports nothing.
  MISE_OTEL_ENABLED: "1"
  # `read-write` is mise's default; an empty value is an error.
  MISE_TASK_CACHE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.task_cache)) && 'off' || 'read-write' }}

jobs:
  # Decides whether the change touches only documentation (`docs/**` and `*.md`). The browser, OS, binary and coverage jobs
  # skip then; `check` (lint, typecheck, knip, gen:check, which covers README.md), `unit` and `build` always run. Any doubt
  # (another event, a failed fetch, an all-zero `before` on a new branch, an empty diff) runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `shell: bash`: the job default is the built CLI, which this job does not build.
      - id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # pull_request: base..head; push: before..sha; anything else, or any failure: run everything.
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$BASE_SHA"; head="$HEAD_SHA" ;;
            push) base="$BEFORE_SHA"; head="$GITHUB_SHA" ;;
            *) echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! git fetch --depth=1 origin "$base" "$head" 2>/dev/null; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only --no-renames "$base" "$head") || { echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; }
          docs_only=true
          while IFS= read -r f; do
            case "$f" in docs/*|*.md) ;; *) docs_only=false; break ;; esac
          done <<<"$files"
          [ -n "$files" ] || docs_only=false
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job uploads its partitions as a site update and wakes the Pages deployer (otel-html-collect, publish).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # mise's task state: the freshness records (state dir) and the cached results (task.cache_dir in mise.toml). Every run saves under a unique key and restores the latest of its own job, so an unchanged task replays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
          key: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 60s
          config: .github/otel-html-ci.yaml
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
      - run: mise run gen:check
      - run: mise run check:static
      # The scaling measurement: every catalogue entry cold on generated reports, its class compared with the declared one.
      - run: mise run test:scaling
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          publish: true
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
          command: node dist/cli/main.js
          name: otel-html-${{ github.job }}

  # The unit tests, two shards on their own runners: the suite without @perf, then the @perf files one at a time. No
  # `needs`: like `check` it runs on documentation-only changes too.
  unit:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job uploads its partitions as a site update and wakes the Pages deployer (otel-html-collect, publish).
      actions: write
    env:
      # The @perf budgets scale by (calibration ÷ this), never below 1: GitHub's runners come as AMD EPYC 9V45
      # (~85 ms, budgets as written) and EPYC 7763 (~150 ms, about 1.5×). See test-support/calibrate.ts.
      OTEL_HTML_PERF_REFERENCE_MS: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # mise's task state: the freshness records (state dir) and the cached results (task.cache_dir in mise.toml). Every run saves under a unique key and restores the latest of its own job, so an unchanged task replays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
          key: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}of2-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}of2-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 60s
          config: .github/otel-html-ci.yaml
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
      - run: mise run test:unit:main -- --shard=${{ matrix.shard }}/2
      - run: mise run test:unit:perf -- --shard=${{ matrix.shard }}/2
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          publish: true
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
          command: node dist/cli/main.js
          name: otel-html-${{ github.job }}-${{ matrix.shard }}of2

  unit-os:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      # No macOS runners (cost); Linux runs the unit tests in `unit`.
      matrix:
        os: [windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # The job uploads its partitions as a site update and wakes the Pages deployer (otel-html-collect, publish).
      actions: write
    env:
      # The @perf budgets scale by (calibration ÷ this), never below 1: GitHub's runners come as AMD EPYC 9V45
      # (~85 ms, budgets as written) and EPYC 7763 (~150 ms, about 1.5×). See test-support/calibrate.ts.
      OTEL_HTML_PERF_REFERENCE_MS: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # As the other jobs; the third path is mise's Windows state dir, UNVERIFIED (no Windows run yet): a missing directory only makes actions/cache warn.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
            ~/AppData/Local/mise/state
          key: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}of2-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}of2-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 60s
          config: .github/otel-html-ci.yaml
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
      - run: mise run test:unit:main -- --shard=${{ matrix.shard }}/2
      - run: mise run test:unit:perf -- --shard=${{ matrix.shard }}/2
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          publish: true
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
          command: node dist/cli/main.js
          name: otel-html-${{ github.job }}${{ matrix.os && format('-{0}', matrix.os) || '' }}-${{ matrix.shard }}of2

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job uploads its partitions as a site update and wakes the Pages deployer (otel-html-collect, publish).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 60s
          config: .github/otel-html-ci.yaml
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
      # `check:package` (publint + attw) depends on `build`; --skip-deps keeps it from cleaning dist/ under the running job shell.
      - run: mise run --skip-deps check:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          publish: true
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
          command: node dist/cli/main.js
          name: otel-html-${{ github.job }}

  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      # Each browser reports on its own; one failing browser must not hide the others' results.
      fail-fast: false
      matrix:
        # The main pass (`--pass main`): the `<browser>-file` projects, plus the chromium `-http` project on the chromium legs. The @perf passes run in `e2e-perf`.
        project: [chromium, firefox, webkit]
        shard: [1, 2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job uploads its partitions as a site update and wakes the Pages deployer (otel-html-collect, publish).
      actions: write
    # The official image ships all three browsers and their OS libraries, matching @playwright/test (keep this tag
    # in step with package.json). `playwright install --with-deps webkit` spent ~9 of 10 minutes in apt fetching
    # ~190 packages. Non-root (the runner's uid) because Firefox refuses to run as root; HOME is /github/home.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    env:
      # The @perf budgets scale by (calibration ÷ this), never below 1: GitHub's runners come as AMD EPYC 9V45
      # (~85 ms, budgets as written) and EPYC 7763 (~150 ms, about 1.5×). See test-support/calibrate.ts.
      OTEL_HTML_PERF_REFERENCE_MS: "100"
      # The image already has the browsers; test:e2e would otherwise run `playwright install` for all three.
      OTEL_HTML_SKIP_BROWSER_INSTALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # mise's task state: the freshness records (state dir) and the cached results (task.cache_dir in mise.toml). Every run saves under a unique key and restores the latest of its own job, so an unchanged task replays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
          key: mise-tasks-${{ runner.os }}-${{ github.job }}${{ matrix.project && format('-{0}', matrix.project) || '' }}-${{ matrix.shard }}of2-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}${{ matrix.project && format('-{0}', matrix.project) || '' }}-${{ matrix.shard }}of2-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 60s
          config: .github/otel-html-ci.yaml
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
      # The job shell wraps these in `otel-html run`; the exit code is Playwright's.
      # --skip-deps: dist/ was built by the Build step above and must not be cleaned under the running job shell,
      # so the fixture reports are built here, once, and test:e2e's own e2e:fixtures dependency is skipped.
      # --skip-deps also skips e2e:fixtures' own e2e:otel-recorder dependency, which e2e/otel.spec.ts needs.
      - run: mise run --skip-deps e2e:otel-recorder
      - run: mise run --skip-deps e2e:fixtures
      # `--browser` selects the `<browser>-file` and (chromium) `-http` projects; `--pass main` leaves the @perf passes to `e2e-perf`.
      # `--shard i/2` gives each runner half of the spec files by recorded duration (test-support/shard-weights.json).
      - run: mise run --skip-deps test:e2e --browser ${{ matrix.project }} --pass main --shard ${{ matrix.shard }}/2
      # The reporter is `list`, so failure traces and screenshots land in test-results/.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.project }}-${{ matrix.shard }}of2
          path: test-results/
          if-no-files-found: ignore
      # The sample report is the same on every shard; shard 1 uploads it.
      - if: always() && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-report-${{ matrix.project }}
          path: e2e/.reports/sample
          include-hidden-files: true
          if-no-files-found: ignore
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          publish: true
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
          command: node dist/cli/main.js
          name: otel-html-${{ github.job }}${{ matrix.project && format('-{0}', matrix.project) || '' }}-${{ matrix.shard }}of2

  # The @perf passes (`-perf-file`, and `-perf-http` with e2e/scale.spec.ts), Chromium only. Perf tests run one at a
  # time and each shard has its runner to itself, so the main pass no longer waits on them or on the scale reports.
  e2e-perf:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job uploads its partitions as a site update and wakes the Pages deployer (otel-html-collect, publish).
      actions: write
    # The official image ships all three browsers and their OS libraries, matching @playwright/test (keep this tag
    # in step with package.json). `playwright install --with-deps webkit` spent ~9 of 10 minutes in apt fetching
    # ~190 packages. Non-root (the runner's uid) because Firefox refuses to run as root; HOME is /github/home.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    env:
      # The @perf budgets scale by (calibration ÷ this), never below 1: GitHub's runners come as AMD EPYC 9V45
      # (~85 ms, budgets as written) and EPYC 7763 (~150 ms, about 1.5×). See test-support/calibrate.ts.
      OTEL_HTML_PERF_REFERENCE_MS: "100"
      # The image already has the browsers; test:e2e would otherwise run `playwright install` for all three.
      OTEL_HTML_SKIP_BROWSER_INSTALL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # mise's task state: the freshness records (state dir) and the cached results (task.cache_dir in mise.toml). Every run saves under a unique key and restores the latest of its own job, so an unchanged task replays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
          key: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}of2-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}of2-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 60s
          config: .github/otel-html-ci.yaml
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
      # The job shell wraps these in `otel-html run`; the exit code is Playwright's.
      # --skip-deps: dist/ was built by the Build step above and must not be cleaned under the running job shell,
      # so the fixture reports are built here, once, and test:e2e's own e2e:fixtures dependency is skipped.
      # --skip-deps also skips e2e:fixtures' own e2e:otel-recorder dependency, which e2e/otel.spec.ts needs.
      - run: mise run --skip-deps e2e:otel-recorder
      - run: mise run --skip-deps e2e:fixtures
      # `--pass perf`: the chromium `-perf-file` and `-perf-http` projects, one test at a time; `--shard i/2` is Playwright's, by count.
      - run: mise run --skip-deps test:e2e --browser chromium --pass perf --shard ${{ matrix.shard }}/2
      # The reporter is `list`, so failure traces and screenshots land in test-results/.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-perf-${{ matrix.shard }}of2
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          publish: true
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
          command: node dist/cli/main.js
          name: otel-html-${{ github.job }}-${{ matrix.shard }}of2

  # The metrics scale check (spec §7: Explorer < 3.3 s and Catalog < 3 s, twice their medians, on 200 metrics × 1,000 series × 1 h at 10 s),
  # Chromium only, in the Playwright image like the jobs above. Its site-format report writes the full 1 h only for the
  # metric the Explorer charts and the first and last collection for the rest (~0.76M points; a few seconds locally,
  # under a minute on CI); the test fails if either page reads points.parquet without a Range header or an Explorer
  # load reads more than 1.1 × the file (e2e/scale.spec.ts). The matrix jobs leave it off and this job alone sets
  # OTEL_HTML_METRICS_SCALE.
  e2e-metrics-scale:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job uploads its partitions as a site update and wakes the Pages deployer (otel-html-collect, publish).
      actions: write
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    env:
      OTEL_HTML_METRICS_SCALE: "1"
      # On top of the runner factor below: after it, this job's Explorer measured about 2× its local median (3 245 and
      # 4 003 ms against 1 647), where the other DuckDB tests run about 1.4×; the calibration does not capture the gap
      # (#239). The budgets stay twice the local medians; CI allows 1.5× more.
      OTEL_HTML_PERF_FACTOR: "1.5"
      # The @perf budgets scale by (calibration ÷ this), never below 1: GitHub's runners come as AMD EPYC 9V45
      # (~85 ms, budgets as written) and EPYC 7763 (~150 ms, about 1.5×). See test-support/calibrate.ts.
      OTEL_HTML_PERF_REFERENCE_MS: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # mise's task state: the freshness records (state dir) and the cached results (task.cache_dir in mise.toml). Every run saves under a unique key and restores the latest of its own job, so an unchanged task replays.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (the SHA .github/actions/setup pins)
        with:
          path: |
            ~/.local/state/mise
            .mise/task-cache
          key: mise-tasks-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: mise-tasks-${{ runner.os }}-${{ github.job }}-
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 60s
          config: .github/otel-html-ci.yaml
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
      # The metrics-scale tests are @perf @http, so they live in the chromium-perf-http project (the report is in site
      # format). Global setup asserts the other fixture reports exist, and the spec writes the metrics-scale report itself.
      - run: mise run --skip-deps e2e:fixtures
      - run: pnpm exec playwright test e2e/scale.spec.ts --project chromium-perf-http --grep 'metrics scale' --workers=1
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-metrics-scale
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          publish: true
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
          command: node dist/cli/main.js
          name: otel-html-${{ github.job }}

  # Unit coverage of the suite without @perf, on pushes to main and on dispatch (never gates anything). `mise run coverage` has no sources and no
  # cache, so nothing can replay it and leave coverage/ empty.
  coverage:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job uploads its partitions as a site update and wakes the Pages deployer (otel-html-collect, publish).
      actions: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 60s
          config: .github/otel-html-ci.yaml
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
      - run: mise run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: coverage/unit-node/lcov.info
          flags: unit-node
          fail_ci_if_error: true
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: coverage/unit-viewer/lcov.info
          flags: unit-viewer
          fail_ci_if_error: true
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          publish: true
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
          command: node dist/cli/main.js
          name: otel-html-${{ github.job }}

  # The standalone Bun binaries, built and smoke-tested on every PR (convert, serve over HTTP and gRPC, host, ci context,
  # run, SIGINT, bad port; then convert, compaction and host run from outside the checkout). The release workflow keeps its own smoke step, which tests the artefact it uploads.
  binary:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          # Windows here as in the release, so a Windows-only failure shows on the PR rather than after the tag.
          - os: windows-latest
            target: windows-x64
            ext: .exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # The job uploads its partitions as a site update and wakes the Pages deployer (otel-html-collect, publish).
      actions: write
    timeout-minutes: 15
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 60s
          config: .github/otel-html-ci.yaml
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
      - run: mise run build:binaries -- --target "$TARGET"
      - env:
          OTEL_HTML_BINARY: dist/bin/otel-html-${{ matrix.target }}${{ matrix.ext }}
        run: pnpm exec vitest run test/cli/binary.test.ts
      # The binary run from a directory outside the checkout, so a path baked in at build time (parquet-wasm's WASM)
      # cannot be found: a site-format convert must still write a Parquet partition, and a compaction must still run.
      - name: Binary runs outside the checkout (format site)
        shell: bash
        env:
          BIN: ${{ github.workspace }}/dist/bin/otel-html-${{ matrix.target }}${{ matrix.ext }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp "$BIN" "$tmp/otel-html${{ matrix.ext }}"
          cp fixtures/linked-traces.otlp.json "$tmp/in.otlp.json"
          for f in linked-logs logs-only small metrics ci; do cp "fixtures/$f.otlp.json" "$tmp/$f.otlp.json"; done
          printf 'writer:\n  format: site\n  chunkTargetBytes: 2000\n' > "$tmp/small-chunks.yaml"
          # The checkout's node_modules is where the inlined path would point; rename it (in place: a move across
          # drives would copy the tree on Windows) for the run. The trap goes first so a failure restores it.
          root="$PWD"
          trap '[ -d "$root/node_modules.away" ] && mv "$root/node_modules.away" "$root/node_modules"' EXIT
          mv node_modules node_modules.away
          cd "$tmp"
          OTEL_HTML_FORMAT=site ./otel-html${{ matrix.ext }} convert in.otlp.json -o out
          test -s out/data/partitions/000000/spans.parquet
          # D44: the host runs its DuckDB Node engine from files the binary carries (materialised to a temp folder), with
          # no node_modules reachable: it must serve and answer one Arrow query.
          ./otel-html${{ matrix.ext }} host out --port 0 > host.out 2>&1 &
          host_pid=$!
          for _ in $(seq 300); do grep -q '^serving ' host.out && break; sleep 0.1; done
          addr="$(sed -n 's|^serving .* at \(http://[^/]*\)/.*|\1|p' host.out | head -n 1)"
          test -n "$addr" || { cat host.out; kill "$host_pid" || true; exit 1; }
          curl -sf -X POST -H 'content-type: application/json' \
            --data '{"type":"arrow","sql":"SELECT count(*) AS n FROM spans"}' "$addr/query" -o q.arrow \
            || { cat host.out; kill "$host_pid" || true; exit 1; }
          test -s q.arrow
          kill "$host_pid" || true
          # The engine's parquet and json extensions travel with the report, so it opens offline.
          test -s out/assets/parquet.*.duckdb_extension.wasm
          test -s out/assets/json.*.duckdb_extension.wasm
          # A small chunk target makes hundreds of flush partitions, which close compacts into one per 24 hours of
          # data: that runs the streaming reader and writer, the merge rounds and the directory removal inside the
          # binary. Every partition left is a compaction.
          ./otel-html${{ matrix.ext }} convert --config small-chunks.yaml in.otlp.json linked-logs.otlp.json \
            logs-only.otlp.json small.otlp.json metrics.otlp.json ci.otlp.json -o out2
          parts="$(find out2/data/partitions -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          test "$parts" -ge 1
          test "$(grep -o '"source":"compact:' out2/data/manifest.js | wc -l | tr -d ' ')" = "$parts"
          # The local format: the embedded base64 engine files and the Bun-native base64 of the wrappers.
          ./otel-html${{ matrix.ext }} convert --format local --config small-chunks.yaml in.otlp.json -o out3
          test -s out3/assets/duckdb.*.wasm.gz.b64.js
          test -s out3/assets/duckdb.*.worker.b64.js
          test -s out3/assets/duckdb.*.parquet.ext.gz.b64.js
          test -s out3/assets/duckdb.*.json.ext.gz.b64.js
          test -z "$(find out3/assets -name 'duckdb.*.wasm')"
          grep -o 'data/partitions/[0-9]*/[a-z]*\.parquet' out3/data/manifest.js | sort -u | while read -r p; do
            test -s "out3/$p.js"
          done
          # One wrapper's payload decodes to Parquet: the magic "PAR1" opens the file.
          w="$(find out3/data/partitions -name spans.parquet.js | head -n 1)"
          test "$(sed -e 's/^[^,]*,"//' -e 's/".*$//' "$w" | base64 -d | head -c 4)" = PAR1
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          publish: true
          dispatch-app-id: ${{ vars.DEPLOYER_APP_ID }}
          dispatch-app-private-key: ${{ github.event.sender.type == 'User' && secrets.DEPLOYER_APP_PRIVATE_KEY || '' }}
          command: node dist/cli/main.js
          name: otel-html-${{ github.job }}${{ matrix.target && format('-{0}', matrix.target) || '' }}${{ matrix.os && format('-{0}', matrix.os) || '' }}
