name: load

# The slow load tests (writer peak memory on 1M logs and on 200 metrics × 1,000 series × 360 points, through the CLI
# and through the library API; the receiver under 1M spans and 10M logs), on an ubuntu runner. Not part of `ci`, which is already long: a daily schedule runs
# them only when `main` has moved since the last run that measured (a manual run always measures).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  actions: read

env:
  MISE_DISABLE_TOOLS: claude

jobs:
  # Whether main has changed since the last run whose `load` job passed. A run that skipped the job does not count.
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow load.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run view --repo "$GITHUB_REPOSITORY" "$id" --json jobs --jq '.jobs[] | select(.name == "load") | .conclusion' | grep -qx success; then
              last=$(gh run view --repo "$GITHUB_REPOSITORY" "$id" --json headSha --jq .headSha)
              break
            fi
          done
          echo "last measured: ${last:-never}; now: $GITHUB_SHA"
          if [ "$last" = "$GITHUB_SHA" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  load:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: lscpu | grep -E 'Model name|^CPU\(s\)'; free -m
      # Builds first (the 1M-log test runs the built library), then runs the two gated test files.
      - run: mise run test:load

  # The receiver under load (spec §7): telemetrygen sends 1M spans over gRPC and 10M logs over HTTP to `otel-html serve`,
  # which must write a complete report with every record, reject none and stay under 512 MB; then the viewer's Traces
  # and Logs landings must be interactive on that report. Docker with host networking needs a Linux runner.
  receiver:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: lscpu | grep -E 'Model name|^CPU\(s\)'; free -m
      - run: mise run test:load:receiver
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/load.spec.ts --project 'chromium-http' --workers=1
        env:
          OTEL_HTML_LOAD_REPORT: dist/load-receiver
          OTEL_HTML_PERF_REFERENCE_MS: "100"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-load-receiver
          path: test-results/
          if-no-files-found: ignore
