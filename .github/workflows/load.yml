name: load

# The slow load tests (writer peak memory on 1M logs and on 200 metrics × 1,000 series × 360 points, through the CLI
# and through the library API; the receiver under 1M spans and 1M logs, one request each), on an ubuntu runner. Not part of `ci`, which
# is already long: a daily schedule runs them only when `main` has moved since the last run that measured (a manual run
# always measures).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  actions: read

env:
  MISE_DISABLE_TOOLS: claude

defaults:
  run:
    # Every job's steps run under the built CLI; the steps that run before dist/ exists say `shell: bash`.
    shell: node dist/cli/main.js run -o .otel-html/report -- bash --noprofile --norc -eo pipefail {0}

jobs:
  # Whether main has changed since the last run whose `load` job passed. A run that skipped the job does not count.
  changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow load.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run view --repo "$GITHUB_REPOSITORY" "$id" --json jobs --jq '.jobs[] | select(.name == "load") | .conclusion' | grep -qx success; then
              last=$(gh run view --repo "$GITHUB_REPOSITORY" "$id" --json headSha --jq .headSha)
              break
            fi
          done
          echo "last measured: ${last:-never}; now: $GITHUB_SHA"
          if [ "$last" = "$GITHUB_SHA" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  load:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - name: otel-html context
        shell: bash
        run: node dist/cli/main.js ci context
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: lscpu | grep -E 'Model name|^CPU\(s\)'; free -m
      # The explicit build above is the 1M-log test's built library; `--skip-deps` keeps the task from rebuilding
      # `dist/` under the running job shell.
      - run: mise run --skip-deps test:load
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otel-html-${{ github.job }}
          path: .otel-html/
          include-hidden-files: true
          if-no-files-found: ignore

  # The receiver under load (spec §7): telemetrygen sends 1M spans over gRPC (paced at 500 spans/s per worker (250
  # traces/s) so it does not drop them) and 1M logs over HTTP (one record per request, so 1M requests) to
  # `otel-html serve`, which must write a complete report with every record, reject none and stay under 512 MB; then
  # the viewer's Traces and Logs landings must be interactive on that report. Docker with host networking needs a Linux
  # runner.
  receiver:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell below is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - name: otel-html context
        shell: bash
        run: node dist/cli/main.js ci context
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: lscpu | grep -E 'Model name|^CPU\(s\)'; free -m
      - run: mise run --skip-deps test:load:receiver
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/load.spec.ts --project 'chromium-http' --workers=1
        env:
          OTEL_HTML_LOAD_REPORT: dist/load-receiver
          OTEL_HTML_PERF_REFERENCE_MS: "100"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-load-receiver
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otel-html-${{ github.job }}
          path: .otel-html/
          include-hidden-files: true
          if-no-files-found: ignore
