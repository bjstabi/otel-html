name: actions-smoke

# The composite actions under .github/actions, used from the released CLI on each runner OS. No macOS leg (cost).
on:
  pull_request:
    paths: [".github/actions/**", ".github/workflows/actions-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: otel-html run -o .otel-html/report -- bash --noprofile --norc -eo pipefail {0}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/otel-html-setup
        with:
          version: latest
      - name: The install works
        shell: bash
        run: otel-html --version
      - name: The run context exists
        shell: bash
        run: test -f .otel-html/context.json
      - run: echo hello
      - name: The job report exists
        shell: bash
        run: test -f .otel-html/report/data/manifest.js
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-smoke-${{ matrix.os }}

  # The actions as built from this branch (D67): the `ci update`, `ci dispatch` and `ci deploy` commands exist only on the
  # branch until a release ships them. The job shell is the built CLI, as in ci.yml. The dispatch uses the job token,
  # which the repository's Actions policy refuses, and never fails the job. The deployer rejects these updates (this workflow is
  # not one of its ci-workflows) but still runs one extra pass for them.
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      # The setup reads the run's jobs; the collect dispatches the deployer.
      actions: write
    defaults:
      run:
        shell: node dist/cli/main.js run -o .otel-html/report -- bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
      - run: echo hello
      - name: The job report exists
        shell: bash
        run: test -f .otel-html/report/data/manifest.js
      - if: always()
        id: collect
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-smoke-publish-${{ matrix.os }}
          command: node dist/cli/main.js
          publish: true
      # D51: the upload client proven on this runner. The runtime variables exist only in a JavaScript action's
      # environment, so the CLI runs as a child of github-script.
      - name: Upload an artifact with the built client
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CMD: node dist/cli/main.js
          UPLOAD_NAME: otel-html-smoke-upload-${{ matrix.os }}
        with:
          script: |
            const { spawnSync } = require('node:child_process');
            const [exe, ...args] = process.env.CMD.trim().split(/\s+/);
            const t0 = Date.now();
            const r = spawnSync(exe, [...args, 'ci', 'upload', '--name', process.env.UPLOAD_NAME, '--path', '.otel-html/'], {
              stdio: 'inherit',
              env: { ...process.env },
            });
            core.info(`upload took ${Date.now() - t0} ms`);
            if (r.status !== 0) core.setFailed(`ci upload exited ${r.status ?? r.signal ?? r.error}`);
      - name: The uploaded artifact appears
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_NAME: otel-html-smoke-upload-${{ matrix.os }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name' | grep -qxF "$UPLOAD_NAME"
      - name: The update artifact was uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ steps.collect.outputs.update }}
        run: |
          test -n "$UPDATE"
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name')
          grep -qxF "$UPDATE" <<<"$names"
