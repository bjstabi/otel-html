name: actions-smoke

# The composite actions under .github/actions, used from the released CLI on each runner OS. No macOS leg (cost).
on:
  pull_request:
    paths: [".github/actions/**", ".github/workflows/actions-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: otel-html run -o .otel-html/report -- bash --noprofile --norc -eo pipefail {0}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/otel-html-setup
        with:
          version: latest
      - name: The install works
        shell: bash
        run: otel-html --version
      - name: The run context exists
        shell: bash
        run: test -f .otel-html/context.json
      - run: echo hello
      - name: The job report exists
        shell: bash
        run: test -f .otel-html/report/data/manifest.js
      - if: always()
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-smoke-${{ matrix.os }}

  # The actions as built from this branch (D67): the `ci update`, `ci dispatch` and `ci deploy` commands exist only on the
  # branch until a release ships them. The job shell is the built CLI, as in ci.yml. The dispatch uses the job token,
  # which the repository's Actions policy refuses, and never fails the job. The deployer rejects these updates (this workflow is
  # not one of its ci-workflows) but still runs one extra pass for them.
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      # The setup reads the run's jobs; the collect dispatches the deployer.
      actions: write
    defaults:
      run:
        shell: node dist/cli/main.js run -o .otel-html/report -- bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The job shell is the built CLI, so dist/ must exist before the first `run:` step starts.
      - name: Build otel-html
        shell: bash
        run: mise run build
      # The pusher (Task 4.4): every 3 s it uploads the partitions the job's report gained.
      - uses: ./.github/actions/otel-html-setup
        with:
          command: node dist/cli/main.js
          push-every: 3s
      - run: echo hello
      - name: The job report exists
        shell: bash
        run: test -f .otel-html/report/data/manifest.js
      - name: A config that flushes every second
        shell: bash
        run: |
          printf 'writer:\n  flushIntervalMs: 1000\n' > smoke.yaml
      # Under the job shell (the built CLI), so the report of this job gets the spans: 12 s of one span per second sent to
      # the receiver `run` exports to its child. Several flush partitions appear mid-step, which the pusher ships; the
      # step's end compacts them (builder check 7).
      - name: A span every second for 12 s
        env:
          OTEL_HTML_CONFIG: smoke.yaml
        run: |
          for i in $(seq 1 12); do
            now=$(date +%s)
            curl -fsS -X POST -H 'Content-Type: application/json' "$OTEL_EXPORTER_OTLP_ENDPOINT/v1/traces" --data "{\"resourceSpans\":[{\"resource\":{\"attributes\":[{\"key\":\"service.name\",\"value\":{\"stringValue\":\"smoke\"}}]},\"scopeSpans\":[{\"spans\":[{\"traceId\":\"0123456789abcdef0123456789abcd$(printf %02x "$i")\",\"spanId\":\"00000000000000$(printf %02x "$i")\",\"name\":\"tick $i\",\"kind\":1,\"startTimeUnixNano\":\"${now}000000000\",\"endTimeUnixNano\":\"${now}500000000\"}]}]}]}"
            sleep 1
          done
      - name: The pusher uploaded while the job ran
        shell: bash
        run: |
          cat .otel-html/publish/pusher.log || true
          test -f .otel-html/publish/pusher.pid
          node -e "const l=JSON.parse(require('fs').readFileSync('.otel-html/publish/uploads.json','utf8')); if (l.uploads.length < 1) { console.error('no upload in the ledger'); process.exit(1); } console.log(l.uploads.length + ' uploads before the collect');"
      - if: always()
        id: collect
        uses: ./.github/actions/otel-html-collect
        with:
          name: otel-html-smoke-publish-${{ matrix.os }}
          command: node dist/cli/main.js
          publish: true
      # D51: the upload client proven on this runner. The runtime variables exist only in a JavaScript action's
      # environment, so the CLI runs as a child of github-script.
      - name: Upload an artifact with the built client
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CMD: node dist/cli/main.js
          UPLOAD_NAME: otel-html-smoke-upload-${{ matrix.os }}
        with:
          script: |
            const { spawnSync } = require('node:child_process');
            const [exe, ...args] = process.env.CMD.trim().split(/\s+/);
            const t0 = Date.now();
            const r = spawnSync(exe, [...args, 'ci', 'upload', '--name', process.env.UPLOAD_NAME, '--path', '.otel-html/'], {
              stdio: 'inherit',
              env: { ...process.env },
            });
            core.info(`upload took ${Date.now() - t0} ms`);
            if (r.status !== 0) core.setFailed(`ci upload exited ${r.status ?? r.signal ?? r.error}`);
      - name: The uploaded artifact appears
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_NAME: otel-html-smoke-upload-${{ matrix.os }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name' | grep -qxF "$UPLOAD_NAME"
      # Every update the ledger lists (the pusher's and the final one, which is empty when the pusher shipped everything)
      # is an artifact of this run.
      - name: The update artifacts were uploaded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mine=$(node -e "for (const u of JSON.parse(require('fs').readFileSync('.otel-html/publish/uploads.json','utf8')).uploads) console.log(u.name)")
          test -n "$mine"
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].name')
          while read -r n; do grep -qxF "$n" <<<"$names" || { echo "::error::$n is not an artifact of this run"; exit 1; }; done <<<"$mine"
      # D67 / §8: this job's updates (the pusher's flush ones and the final compacted one) applied to an empty site.
      - name: Download this run's updates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: otel-html-update-push-*
          path: downloaded
      - name: The updates apply to a flush then a compaction
        shell: bash
        run: |
          cat .otel-html/publish/pusher.log || true
          # This job's update names come from its ledger: otel-html-update-push-<key>-<sequence>.
          first=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.otel-html/publish/uploads.json','utf8')).uploads[0].name)")
          # One artifact in the whole run lands in downloaded/ itself: put it in a folder named as its update.
          if [ -f downloaded/update.json ]; then
            mkdir -p "downloaded/$first"
            find downloaded -mindepth 1 -maxdepth 1 ! -name "$first" -exec mv {} "downloaded/$first/" \;
          fi
          # The matrix legs share the run: keep this job's updates.
          key=${first#otel-html-update-push-}
          key=${key%-*}
          for d in downloaded/*/; do
            case "$(basename "$d")" in "otel-html-update-push-$key-"*) ;; *) rm -rf "$d" ;; esac
          done
          find downloaded -mindepth 1 -maxdepth 1
          lowest=$(find downloaded -mindepth 1 -maxdepth 1 -printf '%f\n' | sed 's/.*-//' | sort -n | head -1)
          grep -q 'flush:' "downloaded/otel-html-update-push-$key-$lowest/update.json"
          mkdir scratch
          node dist/cli/main.js ci deploy apply --trust-updates --channel branch/smoke --site scratch --updates downloaded --repository "$GITHUB_REPOSITORY" --retention 30 --pr-retention 10 --pass-run-id "$GITHUB_RUN_ID"
          manifest="scratch/branch/smoke/runs/$GITHUB_RUN_ID/data/manifest.js"
          grep -q 'compact:' "$manifest"
          if grep -q 'flush:' "$manifest"; then echo "::error::the applied manifest still lists a flush source"; exit 1; fi
