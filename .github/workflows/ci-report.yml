name: ci-report

# Builds a ci run's report, uploads it as a site update for the Pages deployer (pages-deploy.yml, the only writer of the
# site) and links it from the run's pull request; uploads the update that removes a pull request's reports when it
# closes, and the one that lifts the removal when it reopens.
#
# Runs from the default branch's copy of this file. The report job dogfoods the code under test: it checks out the
# triggering run's head commit when that commit is in this repository and a person (not a bot) started the run.
# Pushing a branch here already takes write access, so a person's code gains nothing from this job's token. A bot's
# branch (Renovate) carries third-party dependency code that ci.yml runs with a read-only token, and a fork's run may
# be untrusted, so both use the default branch's code. A dispatch uses the code of the ref it was dispatched on.
on:
  workflow_run:
    workflows: [ci, load]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: ci or load workflow run id to report on
        required: true
        type: string
  # `_target`, not `pull_request`: a fork PR's `pull_request` token cannot upload artifacts to the base repository or
  # dispatch the deployer. The cleanup job runs with a write token, so it checks out the default branch only and never
  # the PR's code.
  pull_request_target:
    types: [closed, reopened]

# Each job asks for what it needs.
permissions: {}

env:
  # `claude` in mise.toml is a developer tool; CI never needs it.
  MISE_DISABLE_TOOLS: claude

jobs:
  report:
    # A failed or cancelled run is the most interesting report; only runs that never really ran are skipped.
    if: github.event_name != 'pull_request_target' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'action_required'))
    runs-on: ubuntu-latest
    # One report per run at a time. The deployer serializes the site writes, not this job.
    concurrency:
      group: ci-report-${{ inputs.run_id || github.event.workflow_run.id }}
      cancel-in-progress: false
    permissions:
      # Downloading the run's artifacts, uploading the update, dispatching the deployer.
      actions: write
      # The checkout.
      contents: read
      # configure-pages reads the site's base URL.
      pages: read
      # `ci link`: the sticky PR comment and the check run.
      pull-requests: write
      checks: write
    timeout-minutes: 15
    steps:
      # The run's own commit when it is in this repository and a person started it, so a pull request's report is
      # built and placed by the pull request's code; otherwise (a fork's or a bot's run, or a dispatch) the event's
      # default ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            github.event.workflow_run.actor.type == 'User' && github.event.workflow_run.head_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Report.create serves the viewer from dist/, which a fresh checkout does not have.
      - run: mise run build
      # A branch from before the repo had its own config has no such file to read: no output, so the action's default.
      - id: config
        run: |
          if [ -f .github/otel-html-ci.yaml ]; then
            echo "config=.github/otel-html-ci.yaml" >> "$GITHUB_OUTPUT"
          fi
      # Builds the run report, uploads it as a site update, wakes the deployer and links the report.
      - id: publish
        uses: ./.github/actions/otel-html-publish
        with:
          command: node dist/cli/main.js
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          config: ${{ steps.config.outputs.config }}

  # A closed or merged PR's folder (pr/<number>/) and index entry leave the site when the deployer applies the update;
  # a reopened PR's removal is lifted.
  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The update artifact and the deployer dispatch.
      actions: write
    steps:
      # The default branch, never the PR's head: this job holds a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mise run build
      - uses: ./.github/actions/otel-html-publish
        with:
          command: node dist/cli/main.js
          cleanup-pr: ${{ github.event.action == 'closed' && github.event.pull_request.number || '' }}
          reopen-pr: ${{ github.event.action == 'reopened' && github.event.pull_request.number || '' }}
