name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # `claude` in mise.toml is a developer tool; CI never needs it.
  MISE_DISABLE_TOOLS: claude

jobs:
  # Opens or updates the release PR; when that PR is merged, tags the release and creates the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One native runner per target: the binary is built, smoke-tested by running it, then attached to the release.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, ext: "", smoke: true }
          - { os: ubuntu-24.04-arm, target: linux-arm64, ext: "", smoke: true }
          # No macOS runners (cost): bun cross-compiles the darwin binaries on Linux (ad-hoc signed, so they run
          # on Apple silicon), but a Linux runner cannot execute them, so they skip the binary smoke test.
          - { os: ubuntu-latest, target: darwin-x64, ext: "", smoke: false }
          - { os: ubuntu-latest, target: darwin-arm64, ext: "", smoke: false }
          - { os: windows-latest, target: windows-x64, ext: ".exe", smoke: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup
      - run: mise run build
      - run: mise run build:binaries -- --target "$TARGET"
      - name: Test the binary
        if: matrix.smoke
        env:
          OTEL_HTML_BINARY: dist/bin/otel-html-${{ matrix.target }}${{ matrix.ext }}
        run: pnpm exec vitest run test/cli/binary.test.ts
      - name: Upload to the release
        run: gh release upload "$TAG" "dist/bin/otel-html-$TARGET"* --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.target }}
          path: dist/bin/SHA256SUMS
          if-no-files-found: error

  # Each binary job produced a one-line SHA256SUMS; this job joins them into the single published file.
  checksums:
    needs: [release-please, binaries]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          path: sums
      - name: Assemble SHA256SUMS
        run: |
          set -euo pipefail
          cat sums/*/SHA256SUMS | LC_ALL=C sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          cat SHA256SUMS
      - name: Upload to the release
        run: gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Moves the floating major tag (v0 today, v1 at 1.0) to the new release, so `uses: ...@v0` follows releases. This is
  # the only force push in the repo, and the tag only ever moves forward to a release tag.
  actions-tag:
    needs: [release-please, binaries, checksums]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 1
      - name: Move the major tag
        run: |
          set -euo pipefail
          if ! [[ $TAG =~ ^otel-html-v([0-9]+)\.[0-9A-Za-z.+-]*$ ]]; then
            echo "::error::unexpected release tag '$TAG'; not moving a major tag"
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"

  # Opt-in: set the repository variable NPM_PUBLISH to 'true' once the package is ready to publish.
  npm-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/setup
      - run: mise run build
      - run: npm publish --provenance --access public
