name: otel-html publish
description: >-
  Build a workflow run's report from its otel-html-* job artifacts, upload it as a site update for the Pages deployer,
  wake the deployer and link the report from the run's pull request; or, with cleanup-pr or reopen-pr, upload the
  update that removes a closed pull request's reports from the site, or lifts that removal.

inputs:
  run-id:
    description: >-
      The workflow run to report on. The default serves a `workflow_run` publisher and, failing that, the run this job
      belongs to (a final job in the workflow itself, whose own timings are then incomplete).
    default: ${{ github.event.workflow_run.id || github.run_id }}
  version:
    description: Release version to install, such as `0.2.0`, or `latest`. Ignored when `command` is given.
    default: latest
  command:
    description: An executable to use instead of a download, for example `node dist/cli/main.js`. Empty installs the release binary.
    default: ""
  config:
    description: Dashboard config file for the reports. Empty uses the CI dashboard shipped with this action (otel-html-ci.yaml).
    default: ""
  target:
    description: >-
      `github-pages` uploads the run's site update, wakes the deployer and links the report; `artifact` uploads the run
      report as the `ci-run-report` artifact only: no update, no deployer and no link.
    default: github-pages
  comment:
    description: Post a sticky comment linking the report on the run's open pull requests.
    default: "true"
  check:
    description: Create a check run linking the report on the run's head commit.
    default: "true"
  cleanup-pr:
    description: >-
      A pull request number. When set, the action uploads the update that removes that pull request's reports
      (`pr/<number>/`) from the site instead of publishing: no artifact download, report or link, only the update and
      the deployer's wake-up. Use it in a `pull_request_target: [closed]` job, set to `github.event.pull_request.number`;
      the token then needs only `actions: write`. Requires `target: github-pages`. Not together with `reopen-pr`.
    default: ""
  reopen-pr:
    description: >-
      A pull request number. When set, the action uploads the update that lifts the removal of that pull request's
      reports (a reopened pull request), instead of publishing. Use it in a `pull_request_target: [reopened]` job. The
      token needs only `actions: write`. Requires `target: github-pages`. Not together with `cleanup-pr`.
    default: ""
  deployer-workflow:
    description: >-
      The Pages deployer's workflow file name, dispatched on the default branch after an update is uploaded. The
      deployer also runs on a five-minute tick, so a failed dispatch only delays the site.
    default: pages-deploy.yml
  token:
    description: >-
      Token for the release download, the Actions API, the deployer dispatch, the comment and the check run. It needs
      `actions: write` (the dispatch; it also reads the run's artifacts), `pages: read`, `pull-requests: write` and
      `checks: write`. A `cleanup-pr` or `reopen-pr` job needs only `actions: write`.
    default: ${{ github.token }}

outputs:
  report-url:
    description: The run's report URL once the deployer ships it; empty when no update was uploaded.
    value: ${{ steps.update.outputs.report-url }}
  published:
    description: "`true` when the run's site update was uploaded, otherwise `false`."
    value: ${{ steps.update.outputs.published || 'false' }}

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        CLEANUP: ${{ inputs.cleanup-pr }}
        REOPEN: ${{ inputs.reopen-pr }}
        PRIVATE: ${{ github.event.repository.private }}
      run: |
        case "$TARGET" in
          github-pages | artifact) ;;
          *)
            echo "::error::otel-html publish: target must be github-pages or artifact, not '$TARGET'"
            exit 1
            ;;
        esac
        if [ "$TARGET" = github-pages ] && [ "$PRIVATE" = true ]; then
          echo "::warning::otel-html publish: this repository is private, but its GitHub Pages site is public unless the organization restricts Pages access (GitHub Enterprise Cloud), so the reports' CI logs, job names and pull request titles become public. Use target: artifact to keep them private."
        fi
        if [ -n "$CLEANUP" ] && [ -n "$REOPEN" ]; then
          echo "::error::otel-html publish: give cleanup-pr or reopen-pr, not both"
          exit 1
        fi
        for input in cleanup-pr:"$CLEANUP" reopen-pr:"$REOPEN"; do
          name=${input%%:*}
          value=${input#*:}
          if [ -z "$value" ]; then continue; fi
          if ! [[ $value =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::otel-html publish: $name must be a pull request number, not '$value'"
            exit 1
          fi
          if [ "$TARGET" != github-pages ]; then
            echo "::error::otel-html publish: $name changes the site, so it needs target: github-pages"
            exit 1
          fi
        done
    - name: Install otel-html
      if: inputs.command == ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        # The binaries always come from this action's repository: `action_repository` when used from another repo, and
        # empty for a local `./` use, which is this repository itself (a fork's own releases are not used).
        REPO: ${{ github.action_repository || 'bjstabi/otel-html' }}
        # `@v0` with version `latest` installs the newest 0.x release.
        ACTION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/../otel-html-setup/install.sh" "$VERSION"
    - name: Resolve command
      id: resolve
      shell: bash
      env:
        CMD: ${{ inputs.command }}
        CONFIG: ${{ inputs.config }}
      run: |
        # Each value becomes one GITHUB_OUTPUT line; a newline would inject another output.
        nl=$'\n'
        if [[ $CMD == *"$nl"* || $CONFIG == *"$nl"* ]]; then
          echo "::error::otel-html publish: the command and config inputs must be a single line"
          exit 1
        fi
        {
          echo "command=${CMD:-otel-html}"
          echo "config=${CONFIG:-$GITHUB_ACTION_PATH/otel-html-ci.yaml}"
          echo "artifacts=$RUNNER_TEMP/otel-html-artifacts"
          echo "report=$RUNNER_TEMP/otel-html-run-report"
          echo "updates=$RUNNER_TEMP/otel-html-update"
        } >>"$GITHUB_OUTPUT"
    - if: inputs.cleanup-pr == '' && inputs.reopen-pr == ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.token }}
        pattern: otel-html-*
        path: ${{ steps.resolve.outputs.artifacts }}
    # A run with no job reports (one that skipped its jobs) sets `published=false` and writes nothing.
    - name: Build the run report
      id: report
      if: inputs.cleanup-pr == '' && inputs.reopen-pr == ''
      shell: bash
      env:
        CMD: ${{ steps.resolve.outputs.command }}
        CONFIG: ${{ steps.resolve.outputs.config }}
        ARTIFACTS: ${{ steps.resolve.outputs.artifacts }}
        REPORT: ${{ steps.resolve.outputs.report }}
        RUN_ID: ${{ inputs.run-id }}
        # On github-pages the table goes to a scratch file for this step only: `ci link` writes the summary with the
        # report's link on a published run, and the "Summary without a link" step appends the file otherwise.
        SUMMARY_FILE: ${{ inputs.target == 'github-pages' && format('{0}/otel-html-report-summary.md', runner.temp) || '' }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        if [ -n "$SUMMARY_FILE" ]; then
          rm -f "$SUMMARY_FILE"
          export GITHUB_STEP_SUMMARY=$SUMMARY_FILE
        fi
        # CMD is deliberately unquoted: it may be a command with arguments, such as `node dist/cli/main.js`.
        # shellcheck disable=SC2086
        $CMD ci report --run-id "$RUN_ID" --repository "$GITHUB_REPOSITORY" --artifacts "$ARTIFACTS" --out "$REPORT" \
          --config "$CONFIG"
    - if: inputs.cleanup-pr == '' && inputs.reopen-pr == '' && steps.report.outputs.published != 'false'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-run-report
        path: ${{ steps.resolve.outputs.report }}/
        include-hidden-files: true
        if-no-files-found: error
        # A re-run of the report job finds the first attempt's artifact.
        overwrite: true
    - id: pages
      if: inputs.cleanup-pr == '' && inputs.reopen-pr == '' && inputs.target == 'github-pages' && steps.report.outputs.published != 'false'
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      with:
        token: ${{ inputs.token }}
    # Writes the run update (the run's compacted report in `site` format) for the Pages deployer. A run with no channel
    # (a branch with no open PR) is announced by `ci update run` and writes nothing, so `name` is empty. A default-branch
    # run goes to `branch/<name>/` and a pull request's to `pr/<number>/`: each a rolling report over every workflow's runs.
    - name: Write the run update
      id: update
      if: inputs.cleanup-pr == '' && inputs.reopen-pr == '' && inputs.target == 'github-pages' && steps.report.outputs.published != 'false'
      shell: bash
      env:
        CMD: ${{ steps.resolve.outputs.command }}
        CONFIG: ${{ steps.resolve.outputs.config }}
        REPORT: ${{ steps.resolve.outputs.report }}
        UPDATES: ${{ steps.resolve.outputs.updates }}
        RUN_ID: ${{ inputs.run-id }}
        BASE_URL: ${{ steps.pages.outputs.base_url }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        # CMD is deliberately unquoted: it may be a command with arguments, such as `node dist/cli/main.js`.
        # shellcheck disable=SC2086
        $CMD ci update run --report "$REPORT" --out "$UPDATES" --run-id "$RUN_ID" --repository "$GITHUB_REPOSITORY" \
          --base-url "$BASE_URL" --config "$CONFIG"
    # A closed pull request's folder (`pr/<number>/`) and index entry leave the site when the deployer applies this
    # update; a reopened pull request's removal is lifted the same way.
    - name: Write the pull request update
      id: pr-update
      if: inputs.cleanup-pr != '' || inputs.reopen-pr != ''
      shell: bash
      env:
        CMD: ${{ steps.resolve.outputs.command }}
        UPDATES: ${{ steps.resolve.outputs.updates }}
        CLEANUP: ${{ inputs.cleanup-pr }}
        REOPEN: ${{ inputs.reopen-pr }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        if [ -n "$CLEANUP" ]; then
          kind=remove-pr
          pr=$CLEANUP
        else
          kind=reopen-pr
          pr=$REOPEN
        fi
        # CMD is deliberately unquoted: it may be a command with arguments, such as `node dist/cli/main.js`.
        # shellcheck disable=SC2086
        $CMD ci update "$kind" --pr "$pr" --out "$UPDATES"
    # The update folder is the artifact: its name is the folder's, and the deployer finds updates by that name.
    - name: Name the update artifact
      id: artifact
      shell: bash
      env:
        UPDATES: ${{ steps.resolve.outputs.updates }}
        RUN_NAME: ${{ steps.update.outputs.name }}
        PR_NAME: ${{ steps.pr-update.outputs.name }}
      run: |
        name=${RUN_NAME:-$PR_NAME}
        {
          echo "name=$name"
          echo "path=$UPDATES/$name"
        } >>"$GITHUB_OUTPUT"
    - if: steps.artifact.outputs.name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ steps.artifact.outputs.path }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
        # A re-run of the job reuses the run, and so the name.
        overwrite: true
    # Never fails: the deployer's five-minute tick finds the update anyway.
    - name: Wake the deployer
      if: steps.artifact.outputs.name != ''
      shell: bash
      env:
        CMD: ${{ steps.resolve.outputs.command }}
        WORKFLOW: ${{ inputs.deployer-workflow }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        # CMD is deliberately unquoted: it may be a command with arguments, such as `node dist/cli/main.js`.
        # shellcheck disable=SC2086
        $CMD ci dispatch --workflow "$WORKFLOW"
    # A run that reached no site page (no channel, or no update written) still gets the table `ci report` kept in a file.
    # `!cancelled()` lets it run after a failure.
    - name: Summary without a link
      if: >-
        !cancelled() && inputs.cleanup-pr == '' && inputs.reopen-pr == '' && inputs.target == 'github-pages'
        && steps.report.outputs.published != 'false' && steps.update.outputs.published != 'true'
      shell: bash
      env:
        SUMMARY_FILE: ${{ runner.temp }}/otel-html-report-summary.md
      run: |
        if [ -f "$SUMMARY_FILE" ]; then cat "$SUMMARY_FILE" >>"$GITHUB_STEP_SUMMARY"; fi
    # Never fails: a missing comment or check is a warning. Its comment body also goes to the step summary. The link
    # is to the report the deployer is about to ship (a minute or more, and the live index may be older still).
    - name: Link
      if: steps.update.outputs.published == 'true'
      shell: bash
      env:
        CMD: ${{ steps.resolve.outputs.command }}
        RUN_ID: ${{ inputs.run-id }}
        REPORT_URL: ${{ steps.update.outputs.report-url }}
        BASE_URL: ${{ steps.pages.outputs.base_url }}
        COMMENT: ${{ inputs.comment }}
        CHECK: ${{ inputs.check }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        args=()
        if [ "$COMMENT" != true ]; then args+=(--no-comment); fi
        if [ "$CHECK" != true ]; then args+=(--no-check); fi
        # CMD is deliberately unquoted: it may be a command with arguments, such as `node dist/cli/main.js`.
        # shellcheck disable=SC2086
        $CMD ci link --run-id "$RUN_ID" --repository "$GITHUB_REPOSITORY" --url "$REPORT_URL" \
          --index-url "${BASE_URL%/}/index.json" "${args[@]}"
