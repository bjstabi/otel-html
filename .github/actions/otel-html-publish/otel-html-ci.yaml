title: CI
viewer:
  home: dashboards
  defaultDashboard: ci
  defaultWindow: 7d
dashboards:
  - id: ci
    title: CI
    variables:
      - key: vcs.ref.head.name
        label: branch
      - key: cicd.pipeline.trigger
        label: trigger
      - key: cicd.pipeline.task.name
        label: job
      - key: cicd.worker.labels
        label: runner
    quick:
      - label: main
        set:
          vcs.ref.head.name: main
          cicd.pipeline.trigger: null
      - label: pull requests
        set:
          vcs.ref.head.name: null
          cicd.pipeline.trigger: pull_request
      - label: all
        set:
          vcs.ref.head.name: null
          cicd.pipeline.trigger: null
    widgets:
      - type: cicd
        title: Success rate
        view: stat
        stat: success-rate
        x: 0
        y: 0
        w: 2
        h: 6
