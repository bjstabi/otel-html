        title: Median run
        view: stat
        stat: median-run
        x: 2
        y: 0
        w: 2
        h: 6
      - type: cicd
        title: Cache
        view: stat
        stat: cache
        x: 4
        y: 0
        w: 2
        h: 6
      - type: cicd
        title: CI minutes
        view: stat
        stat: minutes
        x: 6
