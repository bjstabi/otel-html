name: otel-html collect
description: "Upload the job's otel-html report. Use it as the job's last step, with if: always()."

inputs:
  name:
    description: Artifact name.
    default: otel-html-${{ github.job }}
  path:
    description: Directory to upload.
    default: .otel-html/

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        include-hidden-files: true
        if-no-files-found: ignore
