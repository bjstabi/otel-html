pre-commit:
  commands:
    biome:
      run: pnpm exec biome check --staged --no-errors-on-unmatched
    typecheck:
      run: mise run typecheck
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    check-static:
      run: mise run check:static
    # The tests changed since the merge base with origin/main (else main); with no merge base at all, every unit test.
    # `mise run verify` before a PR stays the rule (AGENTS.md).
    unit-changed:
      run: |
        base=$(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD main 2>/dev/null)
        if [ -n "$base" ]; then mise run test:unit:changed "$base"; else mise run test:unit:main; fi
