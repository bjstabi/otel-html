[tools]
node = "24.22.1"
bun = "1.4.4"
pnpm = "12.15.0"
lefthook = "2.2.2"
claude = "latest"

[tasks.setup]
run = "pnpm install --frozen-lockfile && lefthook install"

[tasks.lint]
run = "pnpm exec biome ci --error-on-warnings ."

[tasks.format]
run = "pnpm exec biome format --write ."

[tasks.typecheck]
run = "pnpm exec tsc -p tsconfig.json --noEmit && pnpm exec tsc -p tsconfig.viewer.json --noEmit"

[tasks."test:unit"]
run = "pnpm exec vitest run"

[tasks.knip]
run = "pnpm exec knip"

[tasks.gen]
run = "pnpm exec buf generate && bun scripts/gen-schema.ts && bun scripts/gen-ottl.ts"

[tasks."gen:check"]
run = "bash scripts/gen-check.sh"

[tasks.check]
depends = ["lint", "typecheck", "test:unit", "knip"]

[tasks."build:lib"]
run = "pnpm exec tsdown"

[tasks."check:package"]
depends = ["build:lib"]
run = "pnpm exec publint && pnpm exec attw --pack --profile esm-only"
