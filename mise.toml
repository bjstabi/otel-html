#:schema https://mise.jdx.dev/schema/mise.json

# Floor: input groups (`task_config.input_groups`), `mise generate task-docs --inject` and the task artifact cache
# were verified on this version; older ones may ignore or reject them.
min_version = "2026.10.25"

[tools]
node = "24.22.1"
bun = "1.4.4"
pnpm = "12.15.0"
lefthook = "2.2.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
watchexec = "2.8.0"

[settings]
# Needed for the task artifact cache (`cache = { ... }` on lint, typecheck, knip and test:unit:main) AND for input
# groups: without it every task errors. `MISE_TASK_CACHE=off` is the off switch for the cache.
experimental = true
# Freshness by content, not mtime: a checkout or a cache restore rewrites every timestamp.
task.source_freshness_hash_contents = true
# The artifact cache lives in the workspace so CI restores it with actions/cache (next to the freshness records in the state dir).
task.cache_dir = ".mise/task-cache"

# `!` entries inside a group are NOT applied in a merged sources list (verified with --task-cache-explain), so groups hold
# none: @group:node is src/** and test/** including the viewer, and @group:e2e is `e2e/*.ts` so the generated dot
# directories (e2e/.reports, e2e/.metrics-scale*, hundreds of MB) never match.
# Not `global_inputs`: that gives every task sources and an automatic output, so `check`, `test:unit:perf`, `format`,
# `fixtures` and the rest would be skipped as "up to date". Each task with sources lists `@group:deps` instead.
# A task's sources name the groups it reads (`@group:node`) plus anything extra; the checks cover everything their
# tools read, so an edit to any such file re-runs them and an edit to README.md or docs/ does not. The build tasks keep
# src-only lists (a test edit must not rebuild dist/ and every fixture report).
[task_config.input_groups]
deps = [
  ".npmrc",
  "mise.toml",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]
node = [
  "src/**",
  "test-support/**",
  "test/**",
  "tsconfig.base.json",
  "tsconfig.json",
  "vitest.config.ts",
]
viewer = [
  "src/dashboards/**",
  "src/format/**",
  "src/model/**",
  "src/ottl/**",
  "src/query/**",
  "src/rollups/**",
  "src/semconv/**",
  "src/viewer/**",
  "test-support/**",
  "test/viewer/**",
  "tsconfig.viewer.json",
  "vite.config.ts",
]
e2e = [
  "e2e/*.ts",
  "e2e/[!.]*/**",
  "fixtures/**",
  "playwright.config.ts",
  "tsconfig.e2e.json",
  "tsconfig.viewer-data.json",
]
scripts = ["proto/**", "schema/**", "scripts/**", "buf.gen.yaml"]
# What biome, tsc, actionlint and knip read besides the code: every root config file (biome.json, knip.json, tsconfig*.json,
# tsdown/vite/vitest/playwright/commitlint configs, lefthook.yml, ...), the root markdown biome formats (AGENTS.md,
# CLAUDE.md; not README.md or docs/, which biome excludes), the workflows and the actions.
# A new top-level source directory (or root file kind) must be added to a group here, or lint and typecheck skip it.
config = [
  "*.cjs",
  "*.css",
  "*.js",
  "*.json",
  "*.jsonc",
  "*.mjs",
  "*.ts",
  "*.yaml",
  "*.yml",
  ".github/**",
  "AGENTS.md",
  "CLAUDE.md",
]

