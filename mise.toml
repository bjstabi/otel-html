[tools]
node = "24.22.1"
bun = "1.4.4"
pnpm = "12.15.0"
lefthook = "2.2.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
claude = "latest"

[tasks.setup]
run = "pnpm install --frozen-lockfile && lefthook install"

[tasks.lint]
run = "pnpm exec biome ci --error-on-warnings . && actionlint .github/workflows/*.yml"

[tasks.format]
run = "pnpm exec biome format --write ."

[tasks.typecheck]
run = "pnpm exec tsc -p tsconfig.json --noEmit && pnpm exec tsc -p tsconfig.viewer.json --noEmit && pnpm exec tsc -p tsconfig.e2e.json --noEmit"

# Unit tests in two passes: everything but the timing-sensitive `@perf` tests in parallel, then the `@perf` tests
# alone, one file at a time (vitest.config.ts), so other work does not steal their CPU. Budgets scale with
# OTEL_HTML_PERF_FACTOR on slow machines; they are never edited.
[tasks."test:unit"]
run = ["mise run test:unit:main", "mise run test:unit:perf"]

[tasks."test:unit:main"]
run = "pnpm exec vitest run"

[tasks."test:unit:perf"]
run = "OTEL_HTML_PERF_PASS=1 pnpm exec vitest run"

# Slow load tests (writer peak memory), skipped by `test:unit` and `check` unless OTEL_HTML_LOAD=1. The 1M-log
# test runs the built library, hence the build.
[tasks."test:load"]
depends = ["build"]
run = "OTEL_HTML_LOAD=1 pnpm exec vitest run test/writer/metric-memory.test.ts test/writer/log-size.test.ts"

[tasks.knip]
run = "pnpm exec knip"

[tasks.gen]
run = "pnpm exec buf generate && bun scripts/gen-schema.ts && bun scripts/gen-ottl.ts"

[tasks."gen:check"]
run = "bash scripts/gen-check.sh"

# The `@perf` unit tests run after the parallel steps finish, not alongside them.
[tasks.check]
depends = ["lint", "typecheck", "test:unit:main", "knip"]
run = "mise run test:unit:perf"

[tasks."build:lib"]
run = "pnpm exec tsdown"

[tasks."build:viewer"]
run = "pnpm exec vite build"

# The lib build cleans dist/, so it runs first; the viewer build then adds dist/viewer/.
[tasks.build]
run = "mise run build:lib && mise run build:viewer"

[tasks."test:e2e"]
shell = "bash -c"
depends = ["build"]
usage = 'arg "[args]" var=#true'
# Timing-sensitive specs (@perf) run alone afterwards, one worker, so parallel browsers do not steal their CPU.
# Budgets scale with OTEL_HTML_PERF_FACTOR on slow machines; they are never edited.
# CI runs in the official Playwright image and sets OTEL_HTML_SKIP_BROWSER_INSTALL to skip the browser download.
# Extra playwright args (`mise run test:e2e -- --project 'firefox-*'`) are passed to both passes.
# The metrics scale check runs only with OTEL_HTML_METRICS_SCALE=1 (its report: ~15 minutes and ~12 GB the first time,
# then kept in e2e/.cache/): `OTEL_HTML_METRICS_SCALE=1 mise run test:e2e:chromium -- e2e/scale.spec.ts`.
run = """
eval "set -- $usage_args"
# Both passes run; the task fails if either does. Only the @perf pass may match no tests (a spec with none).
rc=0
[ -n "$OTEL_HTML_SKIP_BROWSER_INSTALL" ] || pnpm exec playwright install chromium firefox webkit
pnpm exec playwright test --grep-invert @perf "$@" || rc=1
pnpm exec playwright test --grep @perf --workers=1 --pass-with-no-tests "$@" || rc=1
exit $rc
"""

# Compiles standalone binaries into dist/bin/ (needs `mise run build` first). All five targets by default;
# `mise run build:binaries -- --target darwin-arm64` builds one and merges its line into SHA256SUMS.
[tasks."build:binaries"]
shell = "bash -c"
usage = 'arg "[args]" var=#true'
run = """
eval "set -- $usage_args"
bun scripts/build-binaries.ts "$@"
"""

[tasks."check:package"]
depends = ["build"]
run = "pnpm exec publint && pnpm exec attw --pack --profile esm-only"

# Chromium only (file and http projects): the quick loop while iterating; `test:e2e` is the full matrix.
# Extra playwright args (`mise run test:e2e:chromium -- e2e/metrics-explorer.spec.ts`) are passed to both passes.
[tasks."test:e2e:chromium"]
shell = "bash -c"
depends = ["build"]
usage = 'arg "[args]" var=#true'
run = """
eval "set -- $usage_args"
# Both passes run; the task fails if either does. Only the @perf pass may match no tests (a spec with none).
rc=0
[ -n "$OTEL_HTML_SKIP_BROWSER_INSTALL" ] || pnpm exec playwright install chromium
pnpm exec playwright test --project='chromium-*' --grep-invert @perf "$@" || rc=1
pnpm exec playwright test --project='chromium-*' --grep @perf --workers=1 --pass-with-no-tests "$@" || rc=1
exit $rc
"""

# Regenerates fixtures/*.otlp.json with the OTel SDK (byte-stable). hostile.otlp.json is hand-authored and left alone.
[tasks.fixtures]
run = "bun scripts/fixtures.ts"

# Converts the `small` fixture into a report and opens it in the browser. Interactive only: refuses to run in CI.
[tasks.demo]
shell = "bash -c"
depends = ["build"]
run = """
if [ -n "$CI" ]; then echo 'demo opens a browser and does not run in CI' >&2; exit 1; fi
out="${TMPDIR:-/tmp}/otel-html-demo"
rm -rf "$out"
node dist/cli/main.js convert fixtures/small.otlp.json fixtures/linked-traces.otlp.json fixtures/linked-logs.otlp.json --out "$out" --title 'otel-html demo'
if command -v open >/dev/null 2>&1; then open "$out/index.html"; else xdg-open "$out/index.html"; fi
"""
