[tasks.bootstrap]
description = "Set this machine up: dependencies, git hooks and the Playwright browsers (`mise bootstrap` runs this after the host packages)"
run = [{ task = "setup" }, "pnpm exec playwright install"]

[tasks.setup]
description = "Install dependencies and git hooks"
run = ["pnpm install --frozen-lockfile", "lefthook install"]

[tasks.lint]
description = "biome ci, actionlint, the task graph and the formatting of mise.toml"
sources = [
  "@group:config",
  "@group:deps",
  "@group:e2e",
  "@group:node",
  "@group:scripts",
  "@group:viewer",
]
outputs = []
cache = { enabled = true, env = ["CI"] }
run = [
  "pnpm exec biome ci --error-on-warnings .",
  "actionlint .github/workflows/*.yml",
  "mise tasks validate",
  "mise fmt --check",
]

[tasks.format]
description = "Fix formatting with biome"
run = "pnpm exec biome format --write ."

[tasks.typecheck]
description = "tsc on the node, viewer, viewer-data and e2e projects"
sources = [
  "@group:config",
  "@group:deps",
  "@group:e2e",
  "@group:node",
  "@group:scripts",
  "@group:viewer",
]
outputs = []
cache = { enabled = true }
run = [
  "pnpm exec tsc -p tsconfig.json --noEmit",
  "pnpm exec tsc -p tsconfig.viewer.json --noEmit",
  "pnpm exec tsc -p tsconfig.viewer-data.json --noEmit",
  "pnpm exec tsc -p tsconfig.e2e.json --noEmit",
]

# Unit tests in two passes: everything but the timing-sensitive `@perf` tests in parallel, then the `@perf` tests
# alone, one file at a time (vitest.config.ts), so other work does not steal their CPU. Budgets scale with
# OTEL_HTML_PERF_FACTOR and, with OTEL_HTML_PERF_REFERENCE_MS set, the measured runner factor; they are never edited.
[tasks."test:unit"]
description = "Unit tests: the parallel pass, then the @perf pass"
run = [{ task = "test:unit:main" }, { task = "test:unit:perf" }]

[tasks."test:unit:main"]
description = "vitest, everything but @perf, in parallel (args after `--` go to vitest: `-- --shard=1/2` splits the files by the seconds in test-support/shard-weights.json)"
# Beyond the code: what tests read from disk (fixtures/reports, the committed JSON schema, the shipped CI dashboard
# config, .github/actions scripts, scripts/load-receiver-plan, the e2e helpers they import (e2e/*.ts and e2e/otel-page/,
# not e2e/**, which would walk the generated dot directories), tsconfig.base.json). dist/ is read only under
# OTEL_HTML_LOAD / OTEL_HTML_BINARY, so it is not an input.
sources = [
  "@group:deps",
  "@group:node",
  "@group:viewer",
  ".github/actions/**",
  "e2e/*.ts",
  "e2e/otel-page/**/*.ts",
  "fixtures/**",
  "schema/**",
  "scripts/**",
  ".github/otel-html-ci.yaml",
]
outputs = []
cache = { enabled = true, env = ["CI", "OTEL_HTML_LOAD", "OTEL_HTML_BINARY"] }
# Pinned: an inherited OTEL_HTML_PERF_PASS=1 would select only @perf and cache that as this pass.
env = { OTEL_HTML_PERF_PASS = "0" }
run = "pnpm exec vitest run"

# Env vars go in `env`, not a `VAR=1 cmd` prefix: Windows cmd (the unit-os CI job) can't run that.
[tasks."test:unit:perf"]
description = "The @perf unit tests alone, one file at a time (never cached: timing); args after `--` go to vitest: `-- --shard=1/2` splits the files by the seconds in test-support/shard-weights.json"
env = { OTEL_HTML_PERF_PASS = "1" }
run = "pnpm exec vitest run"

# Slow load tests (writer peak memory), skipped by `test:unit` and `check` unless OTEL_HTML_LOAD=1. The 1M-log
# test runs the built library, hence the build.
[tasks."test:load"]
description = """The slow peak-memory tests: 1M logs; 200 metrics x 1,000 series x 360 points through the CLI and through Report.addMetrics
Runs after a build. Not part of `check` or CI's gate; the `load` workflow runs it on an ubuntu runner on demand, and daily
when main has changed since the last measurement."""
depends = ["build"]
env = { OTEL_HTML_LOAD = "1" }
run = "pnpm exec vitest run test/writer/metric-memory.test.ts test/writer/log-size.test.ts"

# The receiver under load: 1M spans over gRPC, paced at 500 spans/s per worker (250 traces/s) so telemetrygen does not
# drop them, and 1M logs over HTTP from telemetrygen (Docker, host networking: Linux only) into `otel-html serve`, then
# the manifest totals, the rejected count and the peak RSS (serve's own high-water mark) are asserted. The report
# stays in `dist/load-receiver` for `OTEL_HTML_LOAD_REPORT=dist/load-receiver pnpm exec playwright test e2e/load.spec.ts --project chromium-http --workers=1`.
# Smaller runs: `mise run test:load:receiver -- --spans 20000 --logs 100000`.
[tasks."test:load:receiver"]
description = """The receiver under load, after a build (Linux with Docker only)
telemetrygen (a pinned Docker image, on the host network) sends 1M spans over gRPC, paced at 500 spans/s per worker
(250 traces/s), and 1M logs over HTTP (one record per request) to `otel-html serve`; then the report must be complete
with every record, nothing rejected and a peak under 512 MB of resident memory. The report stays in `dist/load-receiver`.
`-- --spans 20000 --logs 100000` runs a small version. The `receiver` job of the `load` workflow runs it, then checks
the Traces and Logs landings with e2e/load.spec.ts."""
depends = ["build"]
shell = "bash -c"
usage = 'arg "[args]" var=#true'
run = """
eval "set -- $usage_args"
bun scripts/load-receiver.ts --out dist/load-receiver "$@"
"""

[tasks.knip]
description = "unused files, exports and dependencies"
sources = [
  "@group:config",
  "@group:deps",
  "@group:e2e",
  "@group:node",
  "@group:scripts",
  "@group:viewer",
]
outputs = []
cache = { enabled = true }
run = "pnpm exec knip"

[tasks.gen]
description = """protobuf-es, the config schema, the OTTL grammar and docs/format/schema.md; also rewrites the README's generated task section
`mise run --force gen` restores a hand-edited generated file (gen:check does this)."""
# The two scripts import src/config (schema.ts and what it pulls in) and read src/ottl/ottl.grammar.
sources = [
  "@group:deps",
  "proto/**",
  "buf.gen.yaml",
  "scripts/gen-schema.ts",
  "scripts/gen-ottl.ts",
  "scripts/gen-schema-doc.ts",
  "src/**",
  "!src/viewer/**",
  "!src/model/gen/**",
  "!src/ottl/*.gen.ts",
  "!src/ottl/*.gen.terms.ts",
]
outputs = [
  "schema/**",
  "src/model/gen/**",
  "src/ottl/*.gen.terms.ts",
  "src/ottl/*.gen.ts",
  "docs/format/schema.md",
]
run = [
  "pnpm exec buf generate",
  "bun scripts/gen-schema.ts",
  "bun scripts/gen-ottl.ts",
  "bun scripts/gen-schema-doc.ts",
  "mise generate task-docs --inject --output README.md",
]

[tasks."gen:check"]
description = "Regenerate with --force and fail if git sees a difference (never cached)"
run = "bash scripts/gen-check.sh"

[tasks."check:static"]
description = "lint, typecheck and knip (the part of `check` without tests)"
depends = ["lint", "typecheck", "knip"]

# The `@perf` unit tests run after the parallel steps finish, not alongside them.
[tasks.check]
description = """Fast gate: lint, typecheck, unit tests, knip
Results of lint, typecheck, knip and the parallel unit pass are cached by the content of their inputs, so a second run
with nothing changed skips them. The unit tests with a time budget (named @perf) always run afterwards, alone and one
file at a time; OTEL_HTML_PERF_FACTOR scales their budgets on a slow machine and, when OTEL_HTML_PERF_REFERENCE_MS is
set (CI sets 100), so does how much slower than that reference a fixed CPU workload runs here (never below 1; the perf
pass logs one `PERF calibration:` line)."""
depends = ["check:static", "test:unit:main"]
run = { task = "test:unit:perf" }

[tasks.verify]
description = "Before a push or a PR: check, then the Chromium e2e suite"
depends = ["check"]
run = { task = "test:e2e:chromium" }

[tasks.coverage]
# No sources and no cache, on purpose: with neither, mise always runs it, so a restored task cache can never replay it
# and leave coverage/ empty. Coverage is only meaningful from the whole suite, never from the subset the cached
# test:unit:main would skip or `vitest --changed` would pick. Pinned like test:unit:main: an inherited
# OTEL_HTML_PERF_PASS=1 would measure only the @perf tests.
description = "Unit coverage from the suite without @perf, per vitest project, into coverage/unit-<project>/ (lcov, summary); never cached"
env = { OTEL_HTML_PERF_PASS = "0" }
run = [
  # Each run is charged only for its own sources. The CLI --coverage.exclude replaces vitest.config.ts's list, so the
  # node run repeats those excludes (generated files) and adds the viewer's.
  "pnpm exec vitest run --project node --coverage --coverage.reportsDirectory=coverage/unit-node '--coverage.exclude=src/model/gen/**' '--coverage.exclude=src/**/*.gen.ts' '--coverage.exclude=src/**/*.gen.terms.ts' '--coverage.exclude=src/viewer/**'",
  "pnpm exec vitest run --project viewer --coverage --coverage.reportsDirectory=coverage/unit-viewer '--coverage.include=src/viewer/**'",
  "bun scripts/coverage-summary.ts",
]

[tasks."test:unit:changed"]
description = "Unit tests whose import graph reaches a file changed since `ref` (default main)"
usage = 'arg "[ref]" default="main"'
run = "pnpm exec vitest run --changed $usage_ref"

[tasks."build:lib"]
description = "Build the library and CLI into dist/ (skipped while up to date)"
sources = [
  "@group:deps",
  "src/**",
  "!src/viewer/**",
  "tsdown.config.ts",
  "tsconfig.base.json",
  "tsconfig.json",
]
outputs = [
  "dist/cli/**",
  "dist/receiver-*.js",
  "dist/index.d.ts",
  "dist/index.js",
]
run = "pnpm exec tsdown"

[tasks."build:viewer"]
description = "Build the viewer and the DuckDB engine files into dist/viewer (skipped while up to date)"
# The lib build cleans dist/, so the viewer builds after it; mise re-runs this task whenever build:lib ran.
depends = ["build:lib"]
sources = [
  "@group:deps",
  "src/dashboards/**",
  "src/format/**",
  "src/model/**",
  "src/ottl/**",
  "src/query/**",
  "src/rollups/**",
  "src/semconv/**",
  "src/viewer/**",
  "scripts/duckdb-extensions.json",
  "scripts/engine-assets.ts",
  "src/writer/engine-assets.ts",
  "tsconfig.base.json",
  "tsconfig.viewer.json",
  "vite.config.ts",
]
# The DuckDB engine files come from @duckdb/duckdb-wasm, whose version is in package.json (@group:deps); the parquet
# and json extensions come from extensions.duckdb.org (pinned by hash in scripts/duckdb-extensions.json) and are cached
# in .cache/duckdb-extensions, so only the first build needs the network (OTEL_HTML_DUCKDB_EXTENSIONS_DIR: offline).
outputs = ["dist/viewer/**"]
run = ["pnpm exec vite build", "bun scripts/engine-assets.ts"]

[tasks.build]
description = "Build the library, then the viewer, into dist/"
depends = ["build:viewer"]

[tasks."e2e:otel-recorder"]
description = "Bundle the e2e in-page span recorder into e2e/.cache/otel-recorder.js (skipped while up to date)"
sources = ["@group:deps", "e2e/otel-page/**"]
outputs = ["e2e/.cache/otel-recorder.js"]
run = "bun build e2e/otel-page/recorder.ts --target browser --format iife --minify --outfile e2e/.cache/otel-recorder.js"

[tasks."e2e:fixtures"]
description = """Build the e2e fixture reports into e2e/.reports/ and their site copies into e2e/.reports-site/ (skipped while up to date)
All but `scale` and `many`, which e2e:fixtures:scale builds; about a second after `build`."""
depends = ["build", "e2e:otel-recorder"]
sources = [
  "@group:deps",
  "dist/**",
  "!dist/bin/**",
  "!dist/load-receiver/**",
  "e2e/build-fixtures.ts",
  "e2e/fixture.ts",
  "e2e/metrics-scale.ts",
  "test-support/scale-logs.ts",
  "test-support/scale-metrics.ts",
  "test-support/otlp-builders.ts",
  "test-support/fixture-ids.ts",
  "fixtures/**",
]
outputs = ["e2e/.reports-site/**", "e2e/.reports/**"]
run = "bun e2e/build-fixtures.ts"

# The scale reports are split from their viewer: the data needs the writer (the build:lib outputs) and the generators,
# the viewer only dist/viewer. A viewer change runs `upgrade` (byte-identical to a fresh convert) instead of writing
# 1M logs again.
[tasks."e2e:fixtures:scale:data"]
description = """Write the e2e `scale` and `many` reports (site format) into e2e/.reports-scale/ (skipped while up to date)
100k spans and 1M logs, converted once (`scale`) and written through the library in 100 flushes (`many`) (~1 GB of memory). Its sources are the writer's build output,
not the viewer's: a viewer change only reruns e2e:fixtures:scale."""
depends = ["build"]
sources = [
  "@group:deps",
  "dist/cli/**",
  "dist/receiver-*.js",
  "dist/index.d.ts",
  "dist/index.js",
  "e2e/build-scale-fixtures.ts",
  "e2e/fixture.ts",
  "test-support/fixture-ids.ts",
  "test-support/otlp-builders.ts",
  "test-support/scale-logs.ts",
  "test-support/scale-metrics.ts",
]
outputs = ["e2e/.reports-scale/**"]
run = "bun e2e/build-scale-fixtures.ts"

[tasks."e2e:fixtures:scale"]
description = """The e2e `scale` and `many` reports with the current viewer (only e2e/scale.spec.ts reads them)
Depends on e2e:fixtures:scale:data; `otel-html upgrade` then swaps in the current dist/viewer (~0.3 s, every run: a
freshness record of its own could miss a viewer that :data wrote in between), so a viewer change never converts again."""
depends = ["e2e:fixtures:scale:data"]
run = "node dist/cli/main.js upgrade e2e/.reports-scale/scale && node dist/cli/main.js upgrade e2e/.reports-scale/many"

# Budgets scale with OTEL_HTML_PERF_FACTOR on slow machines; they are never edited.
# CI runs in the official Playwright image and sets OTEL_HTML_SKIP_BROWSER_INSTALL to skip the browser download.
# The metrics scale check runs only with OTEL_HTML_METRICS_SCALE=1 (its report takes a few seconds locally and under a minute on CI):
# `OTEL_HTML_METRICS_SCALE=1 mise run test:e2e:chromium -- e2e/scale.spec.ts`.
[tasks."test:e2e"]
description = """Playwright over the fixture reports, per browser (--browser chromium|firefox|webkit, default all)
Two passes (`--pass main|perf|all`, default all; CI shards them): the `<browser>-file` and `<browser>-http` projects in parallel (`-http` runs only specs tagged HTTP), then the
`<browser>-perf-file` and `<browser>-perf-http` projects (@perf tests) alone with one worker. Only Chromium has `-http` and the perf projects, and
Firefox and WebKit leave out e2e/scale.spec.ts (playwright.config.ts). Both passes run unless `--pass main` or `--pass perf` selects one; the task fails if a pass does.
Sharding: `--shard 1/2` runs half of each pass. The main pass splits the spec files by the seconds recorded in test-support/shard-weights.json
(playwright.config.ts reads OTEL_HTML_E2E_SHARD, which the task sets for that pass only); the perf pass gets Playwright's `--shard=1/2`, which splits by test count.
Playwright's own `-- --shard=1/2` still works, but splits both passes by count.
The perf pass is skipped for a browser without a `-perf-file` project. The perf pass writes its artifacts to test-results/perf, so it does not clear the first pass's failures. Playwright args after `--` go to both passes (`mise run test:e2e --browser chromium -- e2e/scale.spec.ts`);
narrow the browsers with `--browser`, not `--project`, which would add to the two passes' own projects.
The scale reports (e2e:fixtures:scale, ~15 s cold, ~35 s on CI) are built only when the selection includes e2e/scale.spec.ts, decided
by `playwright test --list` with the same args; a direct `playwright test e2e/scale.spec.ts` needs that task run first.
Browsers are installed first unless OTEL_HTML_SKIP_BROWSER_INSTALL is set (CI's Playwright image has them).
The metrics scale check runs only with OTEL_HTML_METRICS_SCALE=1 (CI runs it in its own Chromium job): it writes a
site-format report of 200 metrics x 1,000 series in which only the charted metric has the full 1 h at 10 s (a few
seconds locally, under a minute on CI, in e2e/.metrics-scale/), serves it over HTTP (the `chromium-perf-http` project),
and fails if the Explorer or Catalog asks for `points.parquet` without a Range header.
The @perf budgets scale by OTEL_HTML_PERF_FACTOR and, when OTEL_HTML_PERF_REFERENCE_MS is set (CI: 100), by how
much slower than that reference a fixed CPU workload runs here (never below 1; the setup logs `PERF calibration: N ms`).
A run whose inputs match a cached success is replayed. `MISE_TASK_CACHE=off` re-runs the browsers, also through
`test:e2e:chromium`; `--force` reaches only the task it is given to, so it works on `test:e2e` and not on the wrapper."""
shell = "bash -c"
depends = ["e2e:fixtures"]
# The key also holds the task's args (--browser, --pass, --shard, specs after `--`) and the resolved tool versions. The workflow file is a
# source because it names the Playwright image the browsers come from. OTEL_HTML_METRICS_SCALE changes which tests run.
sources = [
  "@group:deps",
  "dist/**",
  "!dist/bin/**",
  "!dist/load-receiver/**",
  "@group:e2e",
  "test-support/**",
  "tsconfig.json",
  "tsconfig.base.json",
  ".github/workflows/ci.yml",
]
outputs = []
cache = { enabled = true, env = [
  "CI",
  "OTEL_HTML_PERF_FACTOR",
  "OTEL_HTML_PERF_REFERENCE_MS",
  "OTEL_HTML_SKIP_BROWSER_INSTALL",
  "OTEL_HTML_METRICS_SCALE",
  "OTEL_HTML_LOAD_REPORT",
], command_inputs = [
  "pnpm exec playwright --version",
] }
usage = '''
flag "--browser <browser>" default="*"
flag "--pass <pass>" default="all"
flag "--shard <shard>" default=""
arg "[args]" var=#true
'''
run = """
eval "set -- $usage_args"
rc=0
# --shard i/n: the main pass (and its listing) gets OTEL_HTML_E2E_SHARD, which playwright.config.ts turns into a split of
# the spec files by recorded duration; the perf pass gets Playwright's own --shard. An OTEL_HTML_E2E_SHARD inherited
# from the caller must not reach the perf pass, so it is dropped here and set only on main-pass commands.
unset OTEL_HTML_E2E_SHARD
perf_shard=()
main_env=()
if [ -n "$usage_shard" ]; then
  perf_shard=("--shard=$usage_shard")
  main_env=("OTEL_HTML_E2E_SHARD=$usage_shard")
fi
case "$usage_pass" in
  main | perf | all) ;;
  *) echo "test:e2e: --pass must be main, perf or all (got '$usage_pass')" >&2; exit 2 ;;
esac
# Only Chromium has `-http` and `-perf-file`/`-perf-http` projects; Playwright refuses a --project that matches none, but not a
# wildcard beside one that matches, hence the trailing `*`.
http="${usage_browser}-http*"
perf="${usage_browser}-perf-*"
# Only Chromium has perf projects; decided by name, so a perf listing that fails for another reason (a spec that does
# not load) fails the perf pass below instead of skipping it.
case "$usage_browser" in chromium | '*') has_perf=1 ;; *) has_perf=0 ;; esac
[ "$usage_pass" != main ] || has_perf=0
# The scale reports only when a selected test is in e2e/scale.spec.ts. Each pass is listed on its own, with the args
# and the shard it runs with (`env` carries the main pass's OTEL_HTML_E2E_SHARD), so the listing selects the same tests
# as the pass; a listing that fails builds them too, and the passes below report its error. --skip-deps: dist/ is
# already built (and in CI it must not be rebuilt under the job shell).
needs_scale() {
  local listed
  listed=$(env "$@" --list 2>&1) || return 0
  grep -qF 'scale.spec.ts' <<<"$listed"
}
if { [ "$usage_pass" != perf ] && needs_scale "${main_env[@]}" pnpm exec playwright test "$@" --project "${usage_browser}-file" --project "$http" --grep-invert @perf; } ||
  { [ "$has_perf" = 1 ] && needs_scale pnpm exec playwright test "$@" "${perf_shard[@]}" --project "$perf"; }; then
  echo "test:e2e: the selection needs the scale reports (e2e:fixtures:scale)"
  mise run --skip-deps e2e:fixtures:scale:data && mise run --skip-deps e2e:fixtures:scale || exit 1
else
  echo "test:e2e: the selection does not need the scale reports"
fi
[ -n "$OTEL_HTML_SKIP_BROWSER_INSTALL" ] || pnpm exec playwright install chromium firefox webkit
if [ "$usage_pass" != perf ]; then
  env "${main_env[@]}" pnpm exec playwright test "$@" --project "${usage_browser}-file" --project "$http" --grep-invert @perf || rc=1
fi
if [ "$has_perf" = 1 ]; then
  pnpm exec playwright test "$@" "${perf_shard[@]}" --project "$perf" --workers=1 --pass-with-no-tests --output test-results/perf || rc=1
elif [ "$usage_pass" != main ]; then
  echo "test:e2e: no perf pass for ${usage_browser} (only Chromium has one)"
fi
exit $rc
"""

# Compiles standalone binaries into dist/bin/ (needs `mise run build` first). All five targets by default;
# `mise run build:binaries -- --target darwin-arm64` builds one and merges its line into SHA256SUMS.
[tasks."build:binaries"]
description = "Compile standalone binaries into dist/bin/ (after build); -- --target darwin-arm64 builds one"
shell = "bash -c"
usage = 'arg "[args]" var=#true'
run = """
eval "set -- $usage_args"
bun scripts/build-binaries.ts "$@"
"""

[tasks."check:package"]
description = "publint and are-the-types-wrong on the packed package"
depends = ["build"]
run = ["pnpm exec publint", "pnpm exec attw --pack --profile esm-only"]

[tasks."test:e2e:chromium"]
description = "Chromium only: the quick loop while iterating (`test:e2e --browser chromium`). Playwright args after `--` (`mise run test:e2e:chromium -- e2e/metrics-explorer.spec.ts`) go to both passes."
shell = "bash -c"
usage = 'arg "[args]" var=#true'
run = """
eval "set -- $usage_args"
[ -n "$OTEL_HTML_SKIP_BROWSER_INSTALL" ] || pnpm exec playwright install chromium
OTEL_HTML_SKIP_BROWSER_INSTALL=1 mise run test:e2e --browser chromium -- "$@"
"""

# The metrics writer benchmark (#35): the 1/30 slice of the metrics scale workload through `Report.addMetrics`,
# under bun. Prints ingest and `close` times and a hash of the report, so a change can show both its speed-up and
# that its output is unchanged. `mise run bench:metrics -- --runs 3 --keep`.
[tasks."bench:metrics"]
description = """Time the metrics writer on 2.4M points (200 metrics x 1,000 series x 12 collections) under bun
Goes through the library API and hashes the report it writes, so a change can show both its speed-up and that its
output is unchanged. `-- --runs 3` takes the median of three; `-- --keep` leaves the last report in a temp folder.
The reference figures are in https://github.com/bjstabi/otel-html/issues/35."""
shell = "bash -c"
usage = 'arg "[args]" var=#true'
run = """
eval "set -- $usage_args"
bun scripts/bench-metrics.ts "$@"
"""

# Regenerates fixtures/*.otlp.json with the OTel SDK (byte-stable). hostile.otlp.json is hand-authored and left alone.
[tasks.fixtures]
description = "Regenerate fixtures/*.otlp.json with the OpenTelemetry SDK"
run = "bun scripts/fixtures.ts"

[tasks."shard-weights"]
description = """Rewrite test-support/shard-weights.json from timed runs of the unit passes and the three browsers' main passes
Run when the CI shards drift apart (a few minutes; nothing runs it automatically). CI splits vitest's and Playwright's
files across shards by these recorded seconds, so every shard computes the same split without state: a file missing from
the table weighs the median. Unit files get the seconds a worker spends on them (environment, setup, import and tests);
Playwright spec files the sum of their tests' durations (Chromium's `-file` and `-http` projects together). Failing
tests still record their durations, and the task then exits non-zero. `-- unit chromium` rewrites only those parts of the table
(parts: unit, chromium, firefox, webkit); a browser run that hangs is killed after 20 minutes and its part is kept."""
depends = ["e2e:fixtures"]
run = "bun scripts/shard-weights.ts"

# Converts the `small`, `linked-*`, `metrics` and `ci` fixtures into one report with the fixture dashboard config and opens it in the browser (on the Checkout dashboard). In code-server or over SSH, serves it over HTTP instead (through code-server's port proxy, or on localhost for VS Code's port forwarding), until Ctrl-C. Interactive only: refuses to run in CI.
[tasks.demo]
description = """Open the small, linked-*, metrics and ci fixtures as one report in a browser (not for CI)
Converts them with fixtures/dashboards.otel-html.yaml (the Checkout and CI dashboards) and opens the report on the
Checkout dashboard. In code-server or over SSH it serves the report over HTTP instead (code-server's port proxy, or
localhost for VS Code's port forwarding; over plain SSH, forward the printed port), until Ctrl-C. Interactive only:
refuses to run in CI."""
shell = "bash -c"
depends = ["build"]
run = """
if [ -n "$CI" ]; then echo 'demo opens a browser and does not run in CI' >&2; exit 1; fi
out="${TMPDIR:-/tmp}/otel-html-demo"
rm -rf "$out"
node dist/cli/main.js convert fixtures/small.otlp.json fixtures/linked-traces.otlp.json fixtures/linked-logs.otlp.json fixtures/metrics.otlp.json fixtures/ci.otlp.json --out "$out" --title 'otel-html demo' --config fixtures/dashboards.otel-html.yaml
if [ -n "$VSCODE_PROXY_URI$SSH_CONNECTION" ]; then exec bun scripts/demo-serve.ts "$out"; fi
if command -v open >/dev/null 2>&1; then open "$out/index.html"; else xdg-open "$out/index.html"; fi
"""
