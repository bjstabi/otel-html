# Dashboard config for the linked-*, metrics and ci fixtures: `mise run demo` converts them all with it, the e2e suite
# all but ci.
# The CI dashboard is .github/otel-html-ci.yaml's, verbatim (test/cli/ci/dashboard-config.test.ts keeps them equal).
viewer:
  defaultDashboard: checkout
  home: dashboards

dashboards:
  - id: checkout
    title: Checkout
    # The environment default names no environment of this data, on purpose (a default the report lacks), so the
    # description says how to fill the page.
    description: Checkout and payments on one page, one widget of each type. It opens on environment ci, which this data lacks; pick production.
    variables:
      - service.name
      - key: deployment.environment.name
        label: environment
        default: ci
    widgets:
      - type: timeline
        x: 0
        y: 0
        w: 12
        h: 6
      - type: traces
        x: 0
        y: 6
        w: 6
        h: 10
      - type: logs
        x: 6
        y: 6
        w: 6
        h: 10
        query: severity_number >= 13
      - type: metric
        title: Request latency
        x: 0
        y: 16
        w: 6
        h: 8
        queries:
          - id: a
            metric: http.server.request.duration
            show: p95
        echarts:
          legend:
            show: false
      - type: toplist
        x: 6
        y: 16
        w: 6
        h: 8
        signal: spans
        groupBy: service.name
      - type: table
        x: 0
        y: 24
        w: 12
        h: 8
        signal: logs
        groupBy: service.name

  - id: ci
    title: CI
    variables:
      - key: cicd.pipeline.name
        label: workflow
      - key: cicd.pipeline.run.id
        label: run
      - key: cicd.pipeline.task.name
        label: job
    widgets:
      - type: timeline
        x: 0
        y: 0
        w: 12
        h: 6
      - type: metric
        title: Job duration
        x: 0
        y: 6
        w: 12
        h: 20
        runBy: resource.attributes["cicd.pipeline.run.id"]
        failedWhen: attributes["cicd.pipeline.task.run.result"] == "failure" or attributes["cicd.pipeline.task.run.result"] == "timeout" or attributes["cicd.pipeline.task.run.result"] == "error"
        queries:
          - id: a
            metric: cicd.pipeline.task.run.duration
            where: resource.attributes["cicd.pipeline.name"] == "ci"
            show: avg
            by: ['attributes["cicd.pipeline.task.name"]']
        display: lines
      - type: metric
        title: Queue time
        x: 0
        y: 38
        w: 12
        h: 12
        runBy: resource.attributes["cicd.pipeline.run.id"]
        controls:
          split: false
        queries:
          - id: a
            metric: cicd.pipeline.task.run.queue.duration
            where: resource.attributes["cicd.pipeline.name"] == "ci"
            show: avg
            by: ['attributes["cicd.pipeline.task.name"]']
      - type: toplist
        # Steps counts the publisher's step spans by name; the query keeps it to them.
        title: Steps
        x: 0
        y: 26
        w: 6
        h: 12
        signal: spans
        query: instrumentation_scope.name == "otel-html-ci" and attributes["github.job.step.number"] != nil
        groupBy: span.name
      - type: toplist
        # Slowest steps ranks the same spans by their longest duration.
        title: Slowest steps
        x: 6
        y: 26
        w: 6
        h: 12
        signal: spans
        query: instrumentation_scope.name == "otel-html-ci" and attributes["github.job.step.number"] != nil
        groupBy: span.name
        measure: duration.max
      - type: traces
        title: Runs
        x: 0
        y: 50
        w: 6
        h: 10
        mode: traces
        # The run span sits on the run's resource, so with `job` set the job span is what lists the run.
        query: IsRootSpan() or attributes["cicd.pipeline.task.run.id"] != nil
      - type: logs
        title: Warnings and errors
        x: 6
        y: 50
        w: 6
        h: 10
        query: severity_number >= 13

views:
  - id: slow-spans
    title: Spans by service
    page: traces
    mode: spans
    view: toplist
    groupBy: service.name
  - id: warnings
    title: Warnings and errors
    page: logs
    query: severity_number >= 13
  - id: latency
    title: Request latency p95
    page: metrics
    metrics:
      queries:
        - id: a
          metric: http.server.request.duration
          show: p95
