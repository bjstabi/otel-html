# Dashboard config for the linked-*, metrics and ci fixtures: `mise run demo` converts them all with it, the e2e suite
# all but ci.
# The CI dashboard is .github/otel-html-ci.yaml's, verbatim (test/cli/ci/dashboard-config.test.ts keeps them equal).
viewer:
  defaultDashboard: checkout
  home: dashboards

dashboards:
  - id: checkout
    title: Checkout
    # The environment default names no environment of this data, on purpose (a default the report lacks), so the
    # description says how to fill the page.
    description: Checkout and payments on one page, one widget of each type. It opens on environment ci, which this data lacks; pick production.
    variables:
      - service.name
      - key: deployment.environment.name
        label: environment
        default: ci
    quick:
      - label: Production
        set:
          deployment.environment.name: production
      - label: Any service
        set:
          service.name: null
    widgets:
      - type: timeline
        x: 0
        y: 0
        w: 12
        h: 6
      - type: traces
        x: 0
        y: 6
        w: 6
        h: 10
      - type: logs
        x: 6
        y: 6
        w: 6
        h: 10
        query: severity_number >= 13
      - type: metric
        title: Request latency
        x: 0
        y: 16
        w: 6
        h: 8
        queries:
          - id: a
            metric: http.server.request.duration
            show: p95
        echarts:
          legend:
            show: false
      - type: toplist
        x: 6
        y: 16
        w: 6
        h: 8
        signal: spans
        groupBy: service.name
      - type: table
        x: 0
        y: 24
        w: 12
        h: 8
        signal: logs
        groupBy: service.name
      - type: toplist
        title: Spans by name
        x: 0
        y: 32
        w: 3
        h: 6
        signal: spans
        groupBy: span.name
      - type: toplist
        title: Logs by severity
        x: 3
        y: 32
        w: 3
        h: 6
        signal: logs
        groupBy: severity_text

  - id: ci
    title: CI
    variables:
      - key: vcs.ref.head.name
        label: branch
      - key: cicd.pipeline.trigger
        label: trigger
      - key: cicd.pipeline.task.name
        label: job
      - key: cicd.worker.labels
        label: runner
    quick:
      - label: main
        set:
          vcs.ref.head.name: main
      - label: pull requests
        set:
          cicd.pipeline.trigger: pull_request
      - label: all
        set:
          vcs.ref.head.name: null
          cicd.pipeline.trigger: null
    widgets:
      - type: cicd
        title: Success rate
        view: stat
        stat: success-rate
        pipeline: ci
        x: 0
        y: 0
        w: 2
        h: 6
      - type: cicd
        title: Median run
        view: stat
        stat: median-run
        pipeline: ci
        x: 2
        y: 0
        w: 2
        h: 6
      - type: cicd
        title: Cache
        view: stat
        stat: cache
        pipeline: ci
        x: 4
        y: 0
        w: 2
        h: 6
      - type: cicd
        title: CI minutes
        view: stat
        stat: minutes
        pipeline: ci
        x: 6
        y: 0
        w: 2
        h: 6
      - type: cicd
        title: Queue p95
        view: stat
        stat: queue-p95
        pipeline: ci
        x: 8
        y: 0
        w: 2
        h: 6
      - type: cicd
        title: Reruns
        view: stat
        stat: reruns
        pipeline: ci
        x: 10
        y: 0
        w: 2
        h: 6
      - type: cicd
        title: Runs over time
        view: runs-trend
        pipeline: ci
        x: 0
        y: 6
        w: 7
        h: 11
      - type: cicd
        title: Runs
        view: runs
        pipeline: ci
        x: 7
        y: 6
        w: 5
        h: 11
      - type: cicd
        title: Jobs
        view: jobs
        pipeline: ci
        x: 0
        y: 17
        w: 12
        h: 14
      - type: cicd
        title: Status grid
        view: status-grid
        pipeline: ci
        x: 0
        y: 31
        w: 12
        h: 12
      - type: cicd
        title: Failures
        view: failures
        pipeline: ci
        x: 0
        y: 43
        w: 7
        h: 10
      - type: cicd
        title: Triggers
        view: triggers
        pipeline: ci
        x: 7
        y: 43
        w: 5
        h: 10
      - type: cicd
        title: Queue
        view: queue
        pipeline: ci
        x: 0
        y: 53
        w: 5
        h: 9
      - type: cicd
        title: CI minutes by day
        view: minutes
        pipeline: ci
        x: 5
        y: 53
        w: 7
        h: 9
      - type: cicd
        title: Tests
        view: tests
        pipeline: ci
        x: 0
        y: 62
        w: 12
        h: 16

views:
  - id: slow-spans
    title: Spans by service
    page: traces
    mode: spans
    view: toplist
    groupBy: service.name
  - id: warnings
    title: Warnings and errors
    page: logs
    query: severity_number >= 13
  - id: latency
    title: Request latency p95
    page: metrics
    metrics:
      queries:
        - id: a
          metric: http.server.request.duration
          show: p95
